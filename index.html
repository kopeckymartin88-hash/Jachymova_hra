];
function animT() { return G.time + (G.shopOpen ? Math.floor(SH.anim * 20) : 0); }
function dragonPalette(id) {
  if (id === 'rainbow') {
    const h = (animT() * 3) % 360;
    return { body: `hsl(${h},75%,55%)`, dark: `hsl(${h},65%,38%)`, wing: `hsl(${(h + 60) % 360},80%,72%)`, belly: '#fff6d0', accent: `hsl(${(h + 180) % 360},85%,60%)` };
  }
  return SKINS.find(k => k.id === id) || SKINS[0];
}
function shopFx(over) { return Object.assign({ skin: SHOP.skin, head: SHOP.head, face: SHOP.face, body: SHOP.body }, over || {}); }

function drawDragon(cx, bottom, face, phase, airborne, vy, breath, scale = 1, blink = false, fx = {}) {
  ctx.save();
  ctx.translate(cx, bottom);
  ctx.scale(face * scale, scale);

  const pal = dragonPalette(fx.skin);
  const green = pal.body, dark = pal.dark, belly = pal.belly, accent = pal.accent;
  const legSwing = airborne ? 0 : Math.sin(phase * 2) * 4;

  // ocas (při létání se točí jako vrtule)
  ctx.save();
  if (fx.flying) { ctx.translate(-7, -11); ctx.rotate(fx.spin); ctx.scale(1.3, 1.3); ctx.translate(7, 11); }
  ctx.fillStyle = green;
  ctx.beginPath();
  ctx.moveTo(-8, -10);
  ctx.quadraticCurveTo(-20, -4 + Math.sin(phase) * 2, -24, -13);
  ctx.quadraticCurveTo(-16, -9, -6, -16);
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.moveTo(-24, -13); ctx.lineTo(-27, -19); ctx.lineTo(-20, -15); ctx.fill();

  ctx.restore();

  // křídlo (za tělem)
  const flap = airborne ? (vy < 0 ? -1 : 0.4) : Math.sin(phase * 0.6) * 0.15;
  ctx.fillStyle = pal.wing;
  ctx.beginPath();
  ctx.moveTo(-4, -17);
  ctx.lineTo(-17, -29 - flap * 8);
  ctx.lineTo(-10, -20 - flap * 4);
  ctx.lineTo(-4, -27 - flap * 8);
  ctx.lineTo(0, -16);
  ctx.fill();
  ctx.fillStyle = dark;
  ctx.fillRect(-4, -19, 3, 3);

  // plášť (za tělem)
  if (fx.body === 'cape') {
    const fl = Math.sin(phase * 1.5) * 2 + (airborne ? 3 : 0);
    ctx.fillStyle = '#d6303f';
    ctx.beginPath(); ctx.moveTo(-1, -23); ctx.lineTo(-21 - fl, -10 + fl * 0.5); ctx.lineTo(-18 - fl, -1); ctx.lineTo(-6, -3); ctx.lineTo(6, -20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9c1c2a';
    ctx.beginPath(); ctx.moveTo(-1, -23); ctx.lineTo(-21 - fl, -10 + fl * 0.5); ctx.lineTo(-15 - fl * 0.7, -9); ctx.closePath(); ctx.fill();
  }

  // zadní nohy (s traktorem je nahradí kola)
  if (!fx.wheels) {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(-4 + legSwing, -3, 5, 3.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.ellipse(6 - legSwing, -3, 5.5, 3.6, 0, 0, 7); ctx.fill();
  }

  // tělo + bříško
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(0, -13, 11, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(3, -11, 6.5, 8.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d9c46a'; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(0, -16 + i * 4); ctx.lineTo(7, -16 + i * 4); ctx.stroke(); }

  // hřbetní ostny
  ctx.fillStyle = accent;
  for (let i = 0; i < 3; i++) {
    const x = -10 + i * 0.5 - i * 1.5, y = -17 - i * 4;
    ctx.beginPath(); ctx.moveTo(x - 2, y + 4); ctx.lineTo(x - 6, y); ctx.lineTo(x, y - 2); ctx.fill();
  }

  // traktorová kola
  if (fx.wheels) { drawWheel(-5, -9, 9, fx.wheelRot || 0); drawWheel(9, -6.5, 6.5, (fx.wheelRot || 0) * 1.4); }

  // ručička
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(8, -11, 3, 2.4, 0.4, 0, 7); ctx.fill();

  // hlava
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.arc(5, -22, 8.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -20, 6.5, 5, 0, 0, 7); ctx.fill();   // čumák
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(16, -22, 1, 0, 7); ctx.fill();                 // nozdra
  // rohy
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-3, -35); ctx.lineTo(4, -29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -30); ctx.lineTo(5, -37); ctx.lineTo(10, -29); ctx.fill();
  // oko
  if (blink) {
    ctx.strokeStyle = '#123'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(5, -23); ctx.lineTo(11, -23); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -24, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(9.4, -24, 1.9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(9.6, -25.4, 1, 1);
  }
  // tvářička
  ctx.fillStyle = 'rgba(255,120,120,.55)';
  ctx.beginPath(); ctx.arc(7, -18, 2.2, 0, 7); ctx.fill();

  // oblečení: tělo (šála, motýlek, sponka pláště)
  if (fx.body === 'scarf') {
    const fl = Math.sin(phase * 1.5) * 1.5 + (airborne ? 2 : 0);
    ctx.fillStyle = '#c92f2f'; ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(-11 - fl, -7); ctx.lineTo(-7 - fl, -5); ctx.lineTo(-2, -14); ctx.fill();
    ctx.strokeStyle = '#e6403f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -16); ctx.quadraticCurveTo(2, -11, 10, -16); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-1, -14.2); ctx.lineTo(0, -12); ctx.moveTo(4, -13.4); ctx.lineTo(5, -11.2); ctx.stroke();
  } else if (fx.body === 'bow') {
    ctx.fillStyle = '#d6303f';
    ctx.beginPath(); ctx.moveTo(4, -13); ctx.lineTo(-3, -17); ctx.lineTo(-3, -9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -13); ctx.lineTo(11, -17); ctx.lineTo(11, -9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8f1824'; ctx.beginPath(); ctx.arc(4, -13, 2.3, 0, 7); ctx.fill();
  } else if (fx.body === 'cape') {
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(2, -15, 2.4, 0, 7); ctx.fill();
  }
  // oblečení: obličej (brýle, maska)
  if (fx.face === 'shades') {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(8.4, -24, 5, 3.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(6.2, -26.2, 2.4, 1.4);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(3.6, -24.6); ctx.lineTo(-2, -26); ctx.moveTo(13, -24); ctx.lineTo(16, -23); ctx.stroke();
  } else if (fx.face === 'mask') {
    ctx.fillStyle = '#1b1b2a'; ctx.beginPath(); ctx.ellipse(6.5, -24, 8.8, 4.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(8.6, -24, 3.4, 2.7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(9.6, -24, 1.5, 0, 7); ctx.fill();
  }
  // oblečení: hlava (kšiltovka, cylindr, korunka)
  if (fx.head === 'cap') {
    ctx.fillStyle = '#e04545'; ctx.beginPath(); ctx.arc(5, -24, 9, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b32f2f'; ctx.beginPath(); ctx.ellipse(13.5, -24.4, 7.5, 2.3, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -33, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(1, -31, 5, 1.6);
  } else if (fx.head === 'tophat') {
    ctx.fillStyle = '#222'; ctx.fillRect(-1, -42, 12, 14);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-1, -32, 12, 2.6);
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(5, -29, 11.5, 2.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(1, -40, 2, 9);
  } else if (fx.head === 'crown') {
    ctx.fillStyle = '#ffd24a'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-2, -28); ctx.lineTo(-2, -36); ctx.lineTo(1.5, -32); ctx.lineTo(5, -39); ctx.lineTo(8.5, -32); ctx.lineTo(12, -36); ctx.lineTo(12, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(5, -31, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a8dde'; ctx.beginPath(); ctx.arc(0.5, -30, 1.1, 0, 7); ctx.arc(9.5, -30, 1.1, 0, 7); ctx.fill();
  }

  // oheň z tlamy
  if (breath > 0) {
    const s = breath / 10;
    ctx.fillStyle = '#ff5a1f';
    ctx.beginPath(); ctx.moveTo(19, -20); ctx.lineTo(19 + 14 * s, -26); ctx.lineTo(19 + 20 * s, -20); ctx.lineTo(19 + 14 * s, -15); ctx.fill();
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.moveTo(19, -20); ctx.lineTo(19 + 9 * s, -23); ctx.lineTo(19 + 12 * s, -20); ctx.lineTo(19 + 9 * s, -17); ctx.fill();
  }
  ctx.restore();
}

function drawStick(e) {
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -60 || x > VW + 60) return;
  const t = e.anim;
  const stunned = e.stun > 0 && !e.dead;
  const run = e.panic && !stunned && !e.dead;
  ctx.save();
  ctx.translate(x, y);
  if (e.dead && e.shot) { ctx.translate(e.w / 2, e.h / 2); ctx.scale(1, -1); ctx.translate(-e.w / 2, -e.h / 2); }
  const squash = (e.dead && !e.shot) ? 0.25 : 1;
  ctx.translate(0, e.h); ctx.scale(1, squash); ctx.translate(0, -e.h);
  if (stunned) ctx.translate(Math.sin(G.time * 2.2) * 1.5, 0);          // chvění

  const ink = '#3b3b3b';
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const lean = run ? e.dir * 3 : 0;

  // čárky rychlosti
  if (run) {
    ctx.save(); ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const yy of [20, 28, 35]) { ctx.moveTo(11 - e.dir * 16, yy); ctx.lineTo(11 - e.dir * (26 + (yy % 3) * 4), yy); }
    ctx.stroke(); ctx.restore();
  }

  // nohy (při běhu kmitají, s dvěma "duchy" pro rozmazání)
  const legs = (phase, amp, alpha) => {
    const sw = Math.sin(phase) * amp;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(11 + lean, 27); ctx.lineTo(4 + sw, 38 - Math.max(0, Math.cos(phase)) * 3);
    ctx.moveTo(11 + lean, 27); ctx.lineTo(18 - sw, 38 - Math.max(0, -Math.cos(phase)) * 3);
    ctx.stroke(); ctx.globalAlpha = 1;
  };
  if (run) { legs(t - 1.4, 9, 0.25); legs(t - 0.7, 9, 0.45); legs(t, 9, 1); }
  else if (stunned) legs(t, 3, 1);
  else legs(t * 2, 4, 1);

  // tělo
  ctx.beginPath(); ctx.moveTo(11, 19); ctx.lineTo(11 + lean, 27); ctx.stroke();

  // ruce
  ctx.beginPath();
  if (run || stunned) {
    const w = run ? Math.sin(t * 3) * 4 : 0;
    ctx.moveTo(11, 22); ctx.lineTo(2, 12 + w); ctx.moveTo(11, 22); ctx.lineTo(20, 12 - w);
  } else {
    ctx.moveTo(11, 22); ctx.lineTo(3, 29); ctx.moveTo(11, 22); ctx.quadraticCurveTo(17, 23, 19, 30);
  }
  ctx.stroke();

  // tykadla
  const wob = Math.sin(G.time * (run ? 0.6 : 0.15) + e.x) * (run ? 3 : 1);
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(8, 2.5); ctx.lineTo(3 + wob, -13);
  ctx.moveTo(14, 2); ctx.lineTo(20 + wob, -15);
  ctx.moveTo(18, 5); ctx.lineTo(26 + wob, -9);
  ctx.stroke();

  // hlava s červenou čmáranicí
  ctx.fillStyle = '#f3efe6'; ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(232,80,70,.85)'; ctx.lineWidth = 1.7;
  ctx.beginPath();
  for (let i = 0; i < 9; i++) { const yy = 2 + i * 2.1; ctx.moveTo(1, yy + (i % 2) * 1.6); ctx.lineTo(21, yy + ((i + 1) % 2) * 1.6); }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.stroke();

  // oči: levé velké s kroužkem, pravé menší vybarvené
  const eo = e.dir * 0.8;
  if (stunned || e.dead) {
    ctx.lineWidth = 1.5; ctx.beginPath();
    for (const ex of [8, 15.5]) { ctx.moveTo(ex - 2, 7); ctx.lineTo(ex + 2, 12); ctx.moveTo(ex + 2, 7); ctx.lineTo(ex - 2, 12); }
    ctx.stroke();
  } else {
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(8 + eo, 9, 3, 4, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(8 + eo, 9, 1.2, 2.6, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.beginPath(); ctx.ellipse(15.5 + eo, 10, 1.7, 3, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  // pusa
  if (run || stunned) { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(11, 15.5, 2.6, 3, 0, 0, 7); ctx.fill(); }
  else { ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(5, 15.5); ctx.lineTo(11, 16.2); ctx.lineTo(17, 15.8); ctx.stroke(); }
  ctx.restore();
}

function drawBananaShape(cx, cy, rot, sc) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = '#ffe135'; ctx.strokeStyle = '#a87c00'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -4); ctx.quadraticCurveTo(-2, 12, 11, -6); ctx.quadraticCurveTo(3, 3, -10, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a00'; ctx.fillRect(-11, -5.5, 3, 3); ctx.fillRect(9, -8, 3, 3);
  ctx.restore();
}
function drawBanana(b) {
  const x = b.x + 10 - G.cam;
  if (x < -30 || x > VW + 30) return;
  drawBananaShape(x, b.y + 10, b.rot, 1.15);
}

function drawBoss(e) {
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -120 || x > VW + 120) return;
  const rage = e.hp <= BOSS.hp / 2;
  ctx.save();
  ctx.translate(x + e.w / 2, y + e.h / 2);
  if (e.dying) { ctx.rotate(e.spin); const sc = Math.max(0.15, e.timer / 100); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, e.timer / 40); }
  else if (e.hurt > 0 && Math.floor(e.hurt / 4) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.scale(e.dir, 1);
  ctx.translate(-e.w / 2, -e.h / 2);
  if (rage && !e.dying) { ctx.shadowColor = '#ff3030'; ctx.shadowBlur = 16; }
  const sw = Math.sin(e.anim * 2) * 4;

  // boty a nohy
  ctx.fillStyle = '#2f5aa8'; ctx.fillRect(14, 78, 14, 14); ctx.fillRect(36, 78, 14, 14);
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.ellipse(21 + sw, 93, 13, 5, 0, 0, 7); ctx.ellipse(43 - sw, 93, 13, 5, 0, 0, 7); ctx.fill();

  // ruce (za tělem)
  ctx.strokeStyle = '#f7d02c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  const rw = e.windup > 0 ? Math.min(1, (22 - e.windup) / 8) : 0;                          // zvednutá ruka před hodem
  const rtx = 70 + 4 * rw, rty = 66 - sw * (1 - rw) - 44 * rw;
  ctx.beginPath(); ctx.moveTo(6, 52); ctx.lineTo(-6, 66 + sw); ctx.moveTo(58, 52); ctx.lineTo(rtx, rty); ctx.stroke();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-6, 67 + sw, 6, 0, 7); ctx.arc(rtx, rty + 1, 6, 0, 7); ctx.fill();
  if (e.windup > 0) drawBananaShape(rtx + 2, rty - 12, 0.6, 1.1);

  // tělo (žlutá kapsle) + montérky
  ctx.shadowBlur = 0;
  const body = () => { ctx.beginPath(); ctx.moveTo(4, 30); ctx.arc(32, 30, 28, Math.PI, 0); ctx.lineTo(60, 70); ctx.quadraticCurveTo(60, 84, 46, 84); ctx.lineTo(18, 84); ctx.quadraticCurveTo(4, 84, 4, 70); ctx.closePath(); };
  ctx.fillStyle = '#f7d02c'; body(); ctx.fill();
  ctx.save(); body(); ctx.clip();
  ctx.fillStyle = '#2f5aa8'; ctx.fillRect(0, 56, 64, 32);
  ctx.fillRect(12, 36, 8, 22); ctx.fillRect(44, 36, 8, 22);
  ctx.fillStyle = '#244a8c'; ctx.fillRect(22, 64, 20, 13);
  ctx.fillStyle = '#f7d02c'; ctx.beginPath(); ctx.arc(16, 56, 2.6, 0, 7); ctx.arc(48, 56, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 22, 64, 7);                                    // pásek brýlí
  ctx.restore();

  // brýle a oči
  for (const gx of [20, 44]) {
    ctx.fillStyle = '#c9ced6'; ctx.beginPath(); ctx.arc(gx, 26, 11.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#666'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx, 26, 8.5, 0, 7); ctx.fill();
    ctx.fillStyle = rage ? '#7a1010' : '#5a3a1a'; ctx.beginPath(); ctx.arc(gx + 2, 26, rage ? 3.2 : 4.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(gx + 2.4, 26, 2, 0, 7); ctx.fill();
  }
  if (rage) {                                                                                // zamračené obočí
    ctx.strokeStyle = '#2a1a00'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, 12); ctx.lineTo(28, 19); ctx.moveTo(56, 12); ctx.lineTo(36, 19); ctx.stroke();
  }
  // vlasy
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = -2; i <= 2; i++) { ctx.moveTo(32 + i * 4, 3); ctx.quadraticCurveTo(32 + i * 7, -8, 32 + i * 9, -6 + Math.abs(i) * 2); }
  ctx.stroke();
  // pusa
  if (rage || e.hurt > 0) {
    ctx.fillStyle = '#3a0a0a'; ctx.beginPath(); ctx.ellipse(32, 47, 11, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(24, 40, 16, 4);
  } else {
    ctx.strokeStyle = '#3a2a00'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(32, 42, 10, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.type === 'boss') return drawBoss(e);
  if (e.type === 'stick') return drawStick(e);
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -40 || x > VW + 40) return;
  ctx.save();
  ctx.translate(x + e.w / 2, y + e.h / 2);               // střed Pac-Mana
  if (e.dead && e.shot) ctx.scale(1, -1);                 // trefen ohněm: převrátí se
  ctx.scale(e.dir, 1);                                    // kouká ve směru chůze

  const R = 13;
  let mouth;
  if (e.dead && !e.shot) mouth = (1 - e.timer / 30) * Math.PI * 0.98;   // klasické "zmizení" po zašlápnutí
  else mouth = (0.04 + Math.abs(Math.sin(e.anim * 2.5)) * 0.32) * Math.PI; // žvýkání

  ctx.fillStyle = '#ffd400';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, R, mouth, Math.PI * 2 - mouth);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c99700'; ctx.lineWidth = 1.5; ctx.stroke();

  if (!(e.dead && !e.shot)) {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(2, -7, 2.3, 0, 7); ctx.fill();    // oko
    ctx.fillStyle = '#fff'; ctx.fillRect(2.4, -8.2, 1, 1);
  }
  ctx.restore();
}

function drawFireballs() {
  for (const f of fireballs) {
    const x = f.x - G.cam + 5, y = f.y + 5;
    const r = 6 + Math.sin(G.time * 0.8) * 1;
    ctx.fillStyle = 'rgba(255,90,30,.35)'; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
  }
}

function drawParticles() {
  for (const q of particles) {
    const a = Math.min(1, q.life / 15);
    ctx.globalAlpha = a;
    if (q.text) {
      ctx.fillStyle = q.color; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3;
      ctx.strokeText(q.text, q.x - G.cam, q.y); ctx.fillText(q.text, q.x - G.cam, q.y);
    } else {
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x - G.cam, q.y, q.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function text(str, x, y, size, color = '#fff', align = 'left', stroke = true) {
  ctx.font = `bold ${size}px system-ui, sans-serif`; ctx.textAlign = align;
  if (stroke) { ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD() {
  text('♥', 16, 34, 28, '#ff4d6d'); text('× ' + G.lives, 48, 33, 22);
  text('LEVEL ' + G.level + '/' + LEVEL_COUNT + ' · ' + LV.name, VW / 2, 24, 15, 'rgba(255,255,255,.92)', 'center');
  const boss = LV.boss && enemies.find(e => e.type === 'boss');
  if (boss) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(VW / 2 - 152, 36, 304, 20);
    ctx.fillStyle = boss.hp <= BOSS.hp / 2 ? '#ff4a3a' : '#f7d02c'; ctx.fillRect(VW / 2 - 150, 38, 300 * Math.max(0, boss.hp) / BOSS.hp, 16);
    text('MIMOŇ', VW / 2, 52, 13, '#fff', 'center');
  }
  ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(26, 58, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#c99700'; ctx.fillRect(24, 52, 3, 12);
  text('× ' + G.coins, 42, 65, 18);
  const powers = [['fire', 'OHEŇ', '#ff7a1a', 3600], ['wings', 'LÉTÁNÍ', '#3cb44b', 600], ['wheels', 'TRAKTOR', '#d94040', 1800]];
  let by = 82;
  for (const [k, label, col, max] of powers) {
    const v = P[k];
    if (v <= 0) continue;
    ctx.globalAlpha = (v < 300 && Math.floor(v / 8) % 2 === 0) ? 0.35 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(16, by, 130, 18);
    ctx.fillStyle = col; ctx.fillRect(16, by, 130 * Math.min(1, v / (max * (SHOP.owned.longer ? 1.5 : 1))), 18);
    text(label + ' ' + Math.ceil(v / 60) + ' s', 22, by + 14, 13);
    ctx.globalAlpha = 1; by += 24;
  }
  text('SKÓRE ' + String(G.score).padStart(6, '0'), VW - 16, 32, 22, '#fff', 'right');
  if (G.touch) drawTouchButtons();
  else {
    text('B – obchod', VW - 16, VH - 10, 14, 'rgba(255,255,255,.85)', 'right');
    if (G.muted) text('ZVUKY VYP (M)', VW - 16, 56, 13, '#ffd9d9', 'right');
    if (G.musicOff) text('HUDBA VYP (H)', VW - 16, G.muted ? 72 : 56, 13, '#ffd9d9', 'right');
  }
}

const SHOP = { owned: {}, skin: 'green', head: null, face: null, body: null };
const SH = { tab: 0, sel: 0, hits: [], anim: 0, msg: '', msgOk: true, msgT: 0 };
const UI = { hits: [] };                                   // klikací oblasti dotykových tlačítek na plátně

function resetShop() { SHOP.owned = {}; SHOP.skin = 'green'; SHOP.head = SHOP.face = SHOP.body = null; SH.tab = 0; SH.sel = 0; }
function openShop() {
  if ((G.state !== 'play' && G.state !== 'clear') || G.shopOpen) return;
  G.shopOpen = true; jumpBuf = 0; SH.msgT = 0;
  for (const k in keys) keys[k] = false;
}
function closeShop() { G.shopOpen = false; jumpBuf = 0; pressedEnter = false; for (const k in keys) keys[k] = false; }
function shopTab(i) { SH.tab = (i + SHOP_TABS.length) % SHOP_TABS.length; SH.sel = 0; }
function shopMsg(t, ok) { SH.msg = t; SH.msgOk = ok; SH.msgT = 160; }

function itemState(tab, it) {
  const afford = G.score >= it.price ? 'buy' : 'poor';
  if (tab === 0) return it.repeat ? (G.lives >= 9 ? 'max' : afford) : (SHOP.owned[it.id] ? 'owned' : afford);
  if (tab === 1) return SHOP.skin === it.id ? 'equipped' : (it.price === 0 || SHOP.owned[it.id]) ? 'owned' : afford;
  return SHOP[it.slot] === it.id ? 'equipped' : SHOP.owned[it.id] ? 'owned' : afford;
}

function shopAct() {
  const it = SHOP_ITEMS[SH.tab][SH.sel];
  if (!it) return;
  const st = itemState(SH.tab, it);
  if (st === 'buy') {
    G.score -= it.price;
    if (SH.tab === 0) {
      if (it.id === 'life') G.lives++;
      else { SHOP.owned[it.id] = true; if (it.id === 'shield' && P) P.shield = true; }
    } else if (SH.tab === 1) { SHOP.owned[it.id] = true; SHOP.skin = it.id; }
    else { SHOP.owned[it.id] = true; SHOP[it.slot] = it.id; }
    sfx.coin(); sfx.power(); shopMsg('Koupeno: ' + it.name + '!', true);
  } else if (st === 'owned') {
    if (SH.tab === 0) { sfx.bump(); shopMsg('Tohle už máš.', false); return; }
    if (SH.tab === 1) SHOP.skin = it.id; else SHOP[it.slot] = it.id;
    sfx.coin(); shopMsg('Nasazeno: ' + it.name, true);
  } else if (st === 'equipped') {
    if (SH.tab === 2) { SHOP[it.slot] = null; sfx.bump(); shopMsg('Sundáno: ' + it.name, true); }
  } else if (st === 'poor') { sfx.bump(); shopMsg('Nemáš dost bodů (chybí ' + (it.price - G.score) + ').', false); }
  else if (st === 'max') { sfx.bump(); shopMsg('Už máš maximum životů (9).', false); }
}

function shopKey(code) {
  const n = SHOP_ITEMS[SH.tab].length;
  if (code === 'KeyB' || code === 'Escape') closeShop();
  else if (code === 'ArrowLeft' || code === 'KeyA') SH.sel = Math.max(0, SH.sel - 1);
  else if (code === 'ArrowRight' || code === 'KeyD') SH.sel = Math.min(n - 1, SH.sel + 1);
  else if (code === 'ArrowUp' || code === 'KeyW') SH.sel = Math.max(0, SH.sel - 2);
  else if (code === 'ArrowDown' || code === 'KeyS') SH.sel = Math.min(n - 1, SH.sel + 2);
  else if (code === 'KeyQ' || code === 'PageUp') shopTab(SH.tab - 1);
  else if (code === 'KeyE' || code === 'PageDown') shopTab(SH.tab + 1);
  else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') shopTab(parseInt(code.slice(5), 10) - 1);
  else if (code === 'Enter' || code === 'Space') shopAct();
}
function shopClick(x, y) {
  for (let i = SH.hits.length - 1; i >= 0; i--) {
    const h = SH.hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); return; }
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapLines(str, maxW) {
  ctx.font = '14px system-ui, sans-serif';
  const lines = []; let cur = '';
  for (const w of str.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function shopBtn(x, y, w, h, label, fn, fill, size, color) {
  rr(x, y, w, h, 9); ctx.fillStyle = fill; ctx.fill();
  text(label, x + w / 2, y + h / 2 + (size || 16) * 0.35, size || 16, color || '#fff', 'center', false);
  SH.hits.push({ x, y, w, h, fn });
}
function tapHint(label) { return (G.touch ? 'Klepni – ' : 'ENTER – ') + label; }

function drawShop() {
  SH.anim += 0.06; if (SH.msgT > 0) SH.msgT--;
  SH.hits.length = 0;
  overlay(0.76);
  const items = SHOP_ITEMS[SH.tab], it = items[SH.sel] || items[0];
  rr(24, 14, 752, 452, 16); ctx.fillStyle = 'rgba(22,17,44,.97)'; ctx.fill(); ctx.strokeStyle = '#ffd93b'; ctx.lineWidth = 2; ctx.stroke();
  text('OBCHOD', 46, 54, 30, '#ffd93b', 'left', false);
  text('BODY  ' + G.score, 400, 54, 24, '#fff', 'center', false);
  shopBtn(682, 24, 82, 38, '✕ Zavřít', closeShop, '#8a2a3a', 15);
  SHOP_TABS.forEach((nm, i) => shopBtn(46 + i * 158, 74, 150, 36, nm, () => shopTab(i), i === SH.tab ? '#ffb100' : '#3a3558', 15, i === SH.tab ? '#2a1a00' : '#fff'));

  items.forEach((c, i) => {
    const x = 46 + (i % 2) * 260, y = 124 + Math.floor(i / 2) * 66, w = 250, h = 58;
    const st = itemState(SH.tab, c), sel = i === SH.sel;
    rr(x, y, w, h, 10); ctx.fillStyle = st === 'equipped' ? '#1f4a5a' : st === 'owned' ? '#27423a' : '#2c2748'; ctx.fill();
    ctx.lineWidth = sel ? 3 : 1; ctx.strokeStyle = sel ? '#ffd93b' : 'rgba(255,255,255,.18)'; ctx.stroke();
    if (SH.tab === 1) {
      const pl = dragonPalette(c.id);
      ctx.fillStyle = pl.dark; ctx.beginPath(); ctx.arc(x + 29, y + 29, 17, 0, 7); ctx.fill();
      ctx.fillStyle = pl.body; ctx.beginPath(); ctx.arc(x + 29, y + 29, 13, 0, 7); ctx.fill();
    } else {
      ctx.font = '28px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText(c.icon, x + 29, y + 39);
    }
    text(c.name, x + 54, y + 24, 16, '#fff', 'left', false);
    let label, lc;
    if (st === 'equipped') { label = '● Nasazeno'; lc = '#7fe8ff'; }
    else if (st === 'owned') { label = SH.tab === 0 ? '✓ Koupeno' : '✓ Koupeno · nasadit'; lc = '#8affb0'; }
    else if (st === 'max') { label = 'Maximum (9 životů)'; lc = '#aaa'; }
    else { label = c.price + ' bodů'; lc = st === 'poor' ? '#ff9a9a' : '#ffd93b'; }
    text(label, x + 54, y + 46, 14, lc, 'left', false);
    SH.hits.push({ x, y, w, h, fn: () => { if (SH.sel === i) shopAct(); else SH.sel = i; } });
  });

  // náhled dráčka s vybranou věcí
  rr(574, 122, 182, 258, 12); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
  text('NÁHLED', 665, 144, 13, '#bcb6ff', 'center', false);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(594, 346, 142, 4);
  const ov = SH.tab === 1 ? { skin: it.id } : SH.tab === 2 ? { [it.slot]: it.id } : {};
  drawDragon(668, 346, 1, SH.anim, false, 0, 0, 3.2, Math.floor(SH.anim * 4) % 40 === 0, shopFx(ov));

  // popis a tlačítko
  rr(46, 388, 510, 68, 10); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
  if (SH.msgT > 0) text(SH.msg, 62, 428, 17, SH.msgOk ? '#8affb0' : '#ff9a9a', 'left', false);
  else {
    text(it.name, 62, 410, 17, '#ffd93b', 'left', false);
    ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#d8d6f5';
    wrapLines(it.desc, 480).slice(0, 2).forEach((l, i) => ctx.fillText(l, 62, 430 + i * 17));
  }
  const st = itemState(SH.tab, it);
  let bl, bf;
  if (st === 'buy') { bl = 'KOUPIT za ' + it.price; bf = '#2f9e44'; }
  else if (st === 'owned') { bl = SH.tab === 0 ? 'KOUPENO' : 'NASADIT'; bf = SH.tab === 0 ? '#3b3b4d' : '#2a6fd0'; }
  else if (st === 'equipped') { bl = SH.tab === 2 ? 'SUNDAT' : '✓ NASAZENO'; bf = SH.tab === 2 ? '#7a5a2a' : '#3b3b4d'; }
  else if (st === 'poor') { bl = 'MÁLO BODŮ'; bf = '#7a2e2e'; }
  else { bl = 'MAX ŽIVOTŮ'; bf = '#3b3b4d'; }
  shopBtn(574, 392, 182, 60, bl, shopAct, bf, 17);
  if (!G.touch) text('← ↑ ↓ → výběr · Q / E záložky · Enter koupit / nasadit · B zavřít', 400, 477, 13, 'rgba(255,255,255,.75)', 'center', false);
}

// dotyková tlačítka nakreslená na plátně (pauza, obchod, hudba, zvuky)
function drawTouchButtons() {
  const defs = [
    { ic: G.paused ? '▶' : '❚❚', fs: 13, fn: () => { if (G.state === 'play') G.paused = !G.paused; } },
    { ic: '🛒', fs: 17, fn: openShop },
    { ic: '♪', fs: 22, off: G.musicOff, fn: () => { G.musicOff = !G.musicOff; } },
    { ic: '🔊', fs: 16, off: G.muted, fn: () => { G.muted = !G.muted; } },
  ];
  defs.forEach((d, i) => {
    const cx = VW - 28 - i * 46, cy = 92;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(cx, cy, 19, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = d.fs + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = d.off ? 'rgba(255,255,255,.45)' : '#fff'; ctx.fillText(d.ic, cx, cy + d.fs * 0.35);
    if (d.off) { ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 12, cy + 12); ctx.lineTo(cx + 12, cy - 12); ctx.stroke(); }
    UI.hits.push({ x: cx - 22, y: cy - 22, w: 44, h: 44, fn: d.fn });
  });
}

function overlay(alpha = 0.55) { ctx.fillStyle = `rgba(10,8,25,${alpha})`; ctx.fillRect(0, 0, VW, VH); }

function drawTitle() {
  drawBackground();
  // ozdobná zem
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 400, VW, 14);
  ctx.fillStyle = '#8a5a34'; ctx.fillRect(0, 414, VW, 70);
  overlay(0.25);
  text('DRÁČEK', VW / 2, 120, 76, '#ffd93b', 'center');
  text('plošinovka', VW / 2, 158, 26, '#fff', 'center');
  drawDragon(VW / 2, 400, 1, G.time * 0.1, false, 0, (G.time % 120) < 10 ? 10 - (G.time % 120) : 0, 3.2, (G.time % 150) > 140, shopFx());
  if (Math.floor(G.time / 30) % 2 === 0) text(G.touch ? 'Klepni na obrazovku' : 'Stiskni ENTER nebo MEZERNÍK', VW / 2, 440, 24, '#fff', 'center');
  text('Projdi 21 levelů, sbírej mince i životy a poraž Mimoně na hradě!', VW / 2, 200, 17, '#fff', 'center');
  text('Bonusy v blocích ?: oheň · létání · traktorová kola · truhlička', VW / 2, 228, 16, '#ffe066', 'center');
  text('Pozor na Pankáče: po prvním zásahu utíká, zničíš ho až druhým!', VW / 2, 254, 15, '#ffb27a', 'center');
}

function drawEnd(win) {
  overlay(0.6);
  if (win) {
    text('VYHRÁL JSI! 🐉🔥', VW / 2, 170, 56, '#ffd93b', 'center');
    text('Mimoň je poražen a všech ' + LEVEL_COUNT + ' levelů zdolaných!', VW / 2, 218, 22, '#fff', 'center');
    text('Skóre: ' + G.score + '   (bonus za životy: ' + (G.lives * 500) + ')', VW / 2, 262, 24, '#fff', 'center');
  } else {
    text('KONEC HRY', VW / 2, 180, 60, '#ff6b6b', 'center');
    text('Došel jsi do levelu ' + G.level + ' · skóre: ' + G.score, VW / 2, 232, 24, '#fff', 'center');
    text('Pokračuješ znovu od levelu ' + G.level + ' se 3 životy,', VW / 2, 264, 17, '#ffd9d9', 'center');
    text('body i nákupy z obchodu ti zůstávají (hra se neukládá).', VW / 2, 288, 15, '#ffd9d9', 'center');
  }
  if (G.t2 > 45) text(tapHint(win ? 'nová hra' : 'pokračovat v levelu ' + G.level), VW / 2, 338, 22, '#fff', 'center');
}

function drawClear() {
  overlay(0.55);
  text('LEVEL ' + G.level + ' SPLNĚN!', VW / 2, 170, 54, '#ffd93b', 'center');
  text('Bonus +' + G.clearBonus + ' · skóre ' + G.score + ' · životy ' + G.lives, VW / 2, 218, 22, '#fff', 'center');
  const next = THEMES[G.level];
  const nm = G.level + 1 === LEVEL_COUNT ? 'BOSS – ' + next.name : next.name;
  text('Další: level ' + (G.level + 1) + ' – ' + nm, VW / 2, 262, 20, '#bfe6ff', 'center');
  text(G.touch ? 'Obchod: ikona 🛒 vpravo nahoře' : 'B – obchod (utrať body za vylepšení)', VW / 2, 306, 16, '#ffe066', 'center');
  if (G.t2 > 45) text(tapHint('další level'), VW / 2, 352, 22, '#fff', 'center');
}

function drawPlay() {
  drawBackground();
  drawItems();
  drawTiles();
  drawFlags();
  drawCoins();
  enemies.forEach(drawEnemy);
  bananas.forEach(drawBanana);
  drawFireballs();
  const p = P;
  const flicker = p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0;
  if (!flicker) drawDragon(p.x + p.w / 2 - G.cam, p.y + p.h, p.face, p.anim, !p.ground, p.vy, p.breath, 1, false,
    shopFx({ flying: p.wings > 0, spin: p.spin, wheels: p.wheels > 0, wheelRot: p.wrot }));
  if (p.shield) {                                                  // štít z obchodu
    const sx = p.x + p.w / 2 - G.cam, sy = p.y + p.h / 2;
    ctx.fillStyle = 'rgba(150,210,255,.16)'; ctx.beginPath(); ctx.arc(sx, sy, 25, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(170,225,255,' + (0.6 + 0.3 * Math.sin(G.time * 0.15)) + ')'; ctx.lineWidth = 2; ctx.stroke();
  }
  drawParticles();
  drawHUD();
  if (G.banner > 0) {
    ctx.globalAlpha = Math.min(1, G.banner / 40);
    text('LEVEL ' + G.level, VW / 2, 190, 54, '#ffd93b', 'center');
    text(LV.name, VW / 2, 232, 28, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
  if (G.paused) { overlay(0.5); text('PAUZA', VW / 2, VH / 2, 56, '#fff', 'center'); text('P – pokračovat', VW / 2, VH / 2 + 40, 20, '#fff', 'center'); }
}

// ============================================================
//  Hlavní smyčka (pevný krok 60 Hz)
// ============================================================
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;

function tick() {
  if (G.stT !== G.state) { G.stT = G.state; G.t2 = 0; }
  // hudba hraje jen ve hře; po výhře nad bossem zazní finále (Óda na radost)
  if (G.state === 'win' && !G.finaleStarted) { G.finaleStarted = true; musicPlay(22); mus.finale = true; }
  else if (G.state !== 'play' && !(G.state === 'win' && mus.finale) && mus.playing) musicStop();
  if (G.state === 'title') {
    G.time++;
    if (pressedEnter) newGame();
  } else if (G.state === 'play') {
    if (!G.paused && !G.shopOpen) updatePlay();
  } else {
    G.time++; G.t2++;                                      // krátká prodleva, ať Enter/skok hned nepřeskočí obrazovku
    if (G.shopOpen && G.state !== 'clear') G.shopOpen = false;
    if (pressedEnter && G.t2 > 45 && !G.shopOpen) {
      if (G.state === 'clear') startLevel(G.level + 1);
      else if (G.state === 'over') continueGame();
      else newGame();
    }
  }
  pressedEnter = false;
}

function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }

  ctx.clearRect(0, 0, VW, VH);
  UI.hits.length = 0;
  if (G.state === 'title') drawTitle();
  else { drawPlay(); if (G.state === 'win') drawEnd(true); else if (G.state === 'over') drawEnd(false); else if (G.state === 'clear') drawClear(); }
  if (G.shopOpen) drawShop();
  text('v' + VERSION, 10, VH - 10, 14, 'rgba(255,255,255,.85)');
  syncTouchUI();      // verze v levém dolním rohu
  requestAnimationFrame(frame);
}

// ---------- dotykové ovládání (tablet) ----------
function setTouch(v) { if (G.touch === v) return; G.touch = v; document.body.classList.toggle('touch', v); }
let uiLast = '', canFireLast = -1, flyLast = -1;
function syncTouchUI() {                                   // přepíná viditelnost dotykových tlačítek podle stavu hry
  const ui = G.shopOpen ? 'shop' : (G.paused && G.state === 'play') ? 'paused' : G.state;
  if (ui !== uiLast) { uiLast = ui; document.body.dataset.ui = ui; }
  const cf = (P && (P.fire > 0 || SHOP.owned.fire)) ? 1 : 0, fl = (P && P.wings > 0) ? 1 : 0;
  if (cf !== canFireLast) { canFireLast = cf; document.body.classList.toggle('canfire', !!cf); }
  if (fl !== flyLast) { flyLast = fl; document.body.classList.toggle('flying', !!fl); }
}
document.querySelectorAll('#touch .tb').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => {
    e.preventDefault(); initAudio(); setTouch(true);
    keys[k] = true; if (k === 'Space') jumpBuf = 8;
    btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const up = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, up));
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
canvas.addEventListener('pointerdown', e => {              // klepnutí/klik na plátno: menu, obchod, tlačítka v rohu
  initAudio();
  if (e.pointerType === 'touch') setTouch(true);
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * VW / r.width, y = (e.clientY - r.top) * VH / r.height;
  if (G.shopOpen) { shopClick(x, y); return; }
  if (G.state === 'play' || G.state === 'clear') {
    for (const h of UI.hits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); return; }
  }
  if (G.state === 'play') { if (G.paused) G.paused = false; }
  else pressedEnter = true;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('touchstart', () => setTouch(true), { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') G.paused = true; });
setTouch(!!(window.matchMedia && matchMedia('(pointer: coarse)').matches));

G.level = 1; G.banner = 0; G.t2 = 0; G.shopOpen = false; G.musicOff = false;
buildLevel(1);
P = newPlayer(2 * T);
requestAnimationFrame(frame);

// pro testování
window.__game = { G, get P() { return P; }, keys };
</script>
