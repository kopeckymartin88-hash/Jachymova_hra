<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dráček – plošinovka</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121f; color: #e8e6f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { width: min(96vw, calc(96vh * 800 / 480 - 60px)); aspect-ratio: 800 / 480;
    background: #87ceeb; border-radius: 8px; box-shadow: 0 8px 40px #0008; }
  p { margin: 0; font-size: 14px; opacity: .75; text-align: center; padding: 0 12px; }
  kbd { background: #2c2840; border-radius: 4px; padding: 1px 6px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<p><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> chůze · <kbd>↑</kbd> / <kbd>W</kbd> / <kbd>Mezerník</kbd> skok (2× = dvojskok) ·
   <kbd>Shift</kbd> / <kbd>F</kbd> oheň (z bonusu) · <kbd>↑</kbd>/<kbd>↓</kbd> při létání · <kbd>P</kbd> pauza · <kbd>M</kbd> zvuk</p>

<script>
"use strict";
// ============================================================
//  Základní konstanty
// ============================================================
// Verze hry – s každým pushem se zvýší (0.0 → 0.1 → 0.2 …), viz CLAUDE.md a bump-version.sh
const VERSION = '0.1';

const T = 32;                 // velikost dlaždice
const VW = 800, VH = 480;     // velikost obrazovky
let LW = 140;                // šířka levelu v dlaždicích (mění se podle levelu)
const LH = 15;               // výška levelu v dlaždicích
const LEVEL_COUNT = 21;      // celkem levelů (poslední je boss)
// ?level=N v adrese hry spustí hru rovnou od levelu N (jen pro zkoušení)
const START_LEVEL = Math.min(LEVEL_COUNT, Math.max(1, parseInt(new URLSearchParams(location.search).get('level'), 10) || 1));
const GROUND_ROW = 13;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ============================================================
//  Vstup
// ============================================================
const keys = {};
let jumpBuf = 0;              // "zapamatovaný" stisk skoku
let pressedEnter = false;
const GAME_KEYS = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);

addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') jumpBuf = 8;
    if (e.code === 'Enter' || e.code === 'Space') pressedEnter = true;
    if (e.code === 'KeyP' && G.state === 'play') G.paused = !G.paused;
    if (e.code === 'KeyM') G.muted = !G.muted;
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play') G.paused = true; });

// ============================================================
//  Zvuk (Web Audio, žádné soubory)
// ============================================================
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur, type = 'square', slide = 0, vol = 0.05, delay = 0) {
  if (!AC || G.muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur);
}
const sfx = {
  jump:  () => beep(320, 0.18, 'square', 380),
  jump2: () => beep(520, 0.22, 'square', 520, 0.05),
  coin:  () => { beep(988, 0.07, 'square', 0, 0.05); beep(1319, 0.18, 'square', 0, 0.05, 0.07); },
  stomp: () => beep(220, 0.12, 'square', -120, 0.07),
  fire:  () => beep(500, 0.22, 'sawtooth', -380, 0.05),
  kill:  () => beep(300, 0.2, 'triangle', -200, 0.07),
  hurt:  () => beep(200, 0.4, 'sawtooth', -150, 0.07),
  bump:  () => beep(150, 0.08, 'square', 0, 0.05),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.2, 'square', 0, 0.05, i * 0.13)),
  over:  () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.3, 'triangle', 0, 0.07, i * 0.2)),
  check: () => { beep(660, 0.1, 'square'); beep(880, 0.2, 'square', 0, 0.05, 0.1); },
  scream: () => { beep(900, 0.1, 'sawtooth', 500, 0.05); beep(1400, 0.25, 'square', -700, 0.04, 0.1); },
  power: () => [523, 784, 1047, 1568].forEach((f, i) => beep(f, 0.14, 'square', 0, 0.05, i * 0.07)),
};

// ============================================================
//  Stav hry
// ============================================================
const G = { state: 'title', paused: false, muted: false, score: 0, coins: 0, lives: 3, time: 0, cam: 0 };
let grid, coinsList, enemies, fireballs, particles, bumps, items, P, checkpoint;

// ============================================================
//  Level (sestavený programově)
// ============================================================
function buildLevel1() {
  LW = 140;
  grid = Array.from({ length: LH }, () => Array(LW).fill(' '));
  coinsList = []; enemies = []; fireballs = []; particles = []; bumps = {}; items = [];

  const set = (x, y, t) => { if (x >= 0 && x < LW && y >= 0 && y < LH) grid[y][x] = t; };
  const ground = (x1, x2) => { for (let x = x1; x <= x2; x++) { set(x, 13, '#'); set(x, 14, '#'); } };
  const row = (x, y, n, t = 'B') => { for (let i = 0; i < n; i++) set(x + i, y, t); };
  const pipe = (x, h) => { for (let i = 0; i < h; i++) { set(x, 13 - 1 - i, 'T'); set(x + 1, 13 - 1 - i, 'T'); } };
  const coin = (x, y) => coinsList.push({ x: x * T + 8, y: y * T + 6, w: 16, h: 20, got: false });
  const coinRow = (x, y, n) => { for (let i = 0; i < n; i++) coin(x + i, y); };
  const enemy = (x, dir = -1) => enemies.push({ x: x * T + 2, y: GROUND_ROW * T - 26, w: 28, h: 26,
      vx: 0, vy: 0, dir, dead: false, timer: 0, anim: Math.random() * 6 });

  // Země s dírami
  [[0, 27], [30, 49], [53, 77], [81, 99], [103, 139]].forEach(([a, b]) => ground(a, b));

  // Úsek 1: první bloky
  row(9, 9, 1); set(10, 9, '?'); row(11, 9, 1); set(12, 9, '?'); row(13, 9, 1);
  set(11, 5, '?');
  coinRow(15, 11, 3);
  row(20, 9, 4); coinRow(20, 8, 4); set(21, 9, '?');
  // oblouk coinů nad první dírou
  coin(27, 10); coin(28, 9); coin(29, 9); coin(30, 10);

  // Úsek 2: roury a plošiny
  row(36, 10, 5); set(38, 10, '?'); coinRow(36, 9, 5);
  pipe(44, 2);
  pipe(48, 3);
  coinRow(52, 9, 1); coin(51, 10); coin(53, 10);       // nad další dírou

  // Úsek 3: vysoká cesta
  row(56, 9, 3); row(61, 7, 3); row(66, 9, 3); set(57, 9, '?'); set(67, 9, '?');
  coinRow(56, 8, 3); coinRow(61, 6, 3); coinRow(66, 8, 3);
  set(62, 7, '?');
  pipe(72, 1);
  coinRow(74, 11, 3);

  // Úsek 4: schody dolů a díra
  row(79, 10, 2); coin(79, 9); coin(80, 9);
  row(84, 9, 1); set(85, 9, '?'); row(86, 9, 1); set(85, 5, '?');
  row(90, 10, 5); coinRow(90, 9, 5); set(92, 10, '?');
  pipe(96, 2);
  coin(101, 9); coin(102, 10);

  // Úsek 5: finále + schody
  row(106, 9, 3); coinRow(106, 8, 3); set(107, 9, '?');
  row(112, 9, 1); set(113, 9, '?'); row(114, 9, 1);
  pipe(117, 2);
  for (let i = 0; i < 8; i++) for (let j = 0; j <= i; j++) set(123 + i, 12 - j, '#');
  coinRow(121, 11, 1);

  // Nepřátelé
  [16, 24, 34, 40, 46, 57, 63, 69, 75, 86, 92, 94, 108, 111, 115, 119].forEach((x, i) => enemy(x, i % 2 ? 1 : -1));
  // nepřátelé na vysokých plošinách
  enemies.push({ x: 90 * T, y: 10 * T - 26, w: 28, h: 26, vx: 0, vy: 0, dir: 1, dead: false, timer: 0, anim: 0 });
  enemies.push({ x: 36 * T, y: 10 * T - 26, w: 28, h: 26, vx: 0, vy: 0, dir: 1, dead: false, timer: 0, anim: 0 });

  // Pankáč: po prvním zásahu začne utíkat, zničit ho jde až druhým zásahem
  [21, 31, 55, 83, 98, 121].forEach((x, i) => enemies.push({ type: 'stick', x: x * T + 5, y: GROUND_ROW * T - 38,
      w: 22, h: 38, vx: 0, vy: 0, dir: i % 2 ? 1 : -1, dead: false, timer: 0, anim: 0, hits: 0, panic: false, stun: 0 }));

  checkpoint = { x: 66 * T, reached: false, spawnX: 64 * T };
  items.push(lifeItem(62, 5));                         // 1UP srdíčko nad vysokou plošinou
}
// ============================================================
//  Levely 2–21: generátor podle obtížnosti + hradní aréna s bossem
// ============================================================
let LV = { n: 1, name: '', theme: null, boss: false };
function flagX() { return (LW - 6) * T; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// pomocné funkce pro stavbu levelu (pracují s globálními grid / coinsList / enemies / items)
function setT(x, y, t) { if (x >= 0 && x < LW && y >= 0 && y < LH) grid[y][x] = t; }
function groundCols(x1, x2) { for (let x = x1; x <= x2; x++) { setT(x, 13, '#'); setT(x, 14, '#'); } }
function brickRow(x, y, n, t = 'B') { for (let i = 0; i < n; i++) setT(x + i, y, t); }
function pipeAt(x, h) { for (let i = 0; i < h; i++) { setT(x, 12 - i, 'T'); setT(x + 1, 12 - i, 'T'); } }
function towerAt(x, h) { for (let i = 0; i < h; i++) setT(x, 12 - i, 'B'); }
function coinAt(x, y) { coinsList.push({ x: x * T + 8, y: y * T + 6, w: 16, h: 20, got: false }); }
function coinRowAt(x, y, n) { for (let i = 0; i < n; i++) coinAt(x + i, y); }
function pacAt(tx, floorRow, spd, dir) {
  enemies.push({ x: tx * T + 2, y: floorRow * T - 26, w: 28, h: 26, vx: 0, vy: 0, dir, dead: false, timer: 0, anim: Math.random() * 6, spd });
}
function stickAt(tx, floorRow, spd, dir) {
  enemies.push({ type: 'stick', x: tx * T + 5, y: floorRow * T - 38, w: 22, h: 38, vx: 0, vy: 0, dir, dead: false, timer: 0,
                 anim: 0, hits: 0, panic: false, stun: 0, spd });
}
function lifeItem(tx, ty) {
  return { type: 'life', x: tx * T + 4, baseY: ty * T + 4, y: ty * T + 4, w: 24, h: 24, t: 99, got: false };
}
function cellsFree(x1, y1, x2, y2) {
  for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
    if (x < 0 || x >= LW) return false;
    if (y >= 0 && y < LH && grid[y][x] !== ' ') return false;
  }
  return true;
}
function groundSolid(x1, x2) {
  for (let x = x1; x <= x2; x++) if (x < 0 || x >= LW || grid[13][x] !== '#') return false;
  return true;
}
function resetWorld() { coinsList = []; enemies = []; fireballs = []; particles = []; bumps = {}; items = []; }

// Level 2–20: délka, počet děr a nepřátel i jejich rychlost rostou s obtížností d (0 … 1)
function genLevel(n) {
  const rnd = mulberry32(n * 7919 + 101);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const d = (n - 2) / 18;
  LW = Math.round(150 + d * 90);
  grid = Array.from({ length: LH }, () => Array(LW).fill(' '));
  resetWorld();

  // 1) trať: rovné úseky a díry (nejvýš 4 dlaždice, to dráček s rozběhem přeskočí)
  const segs = [[0, 11]], pits = [];
  const pPit = 0.35 + 0.5 * d, maxW = d < 0.35 ? 3 : 4;
  let x = 12;
  while (x < LW - 24) {
    const pit = rnd() < pPit;
    const w = pit ? ri(2, maxW) : 0;
    const L = ri(6, Math.max(7, Math.round(13 - 5 * d)));
    if (pit) { pits.push([x, x + w - 1]); segs.push([x + w, x + w + L - 1]); x += w + L; }
    else { segs[segs.length - 1][1] += L; x += L; }
  }
  segs[segs.length - 1][1] = LW - 1;
  segs.forEach(([a, b]) => groundCols(a, b));

  // 2) schody před cílem
  for (let i = 0; i < 6; i++) for (let j = 0; j <= i; j++) setT(LW - 16 + i, 12 - j, '#');

  // 3) roury a věžičky z cihel (daleko od okrajů děr)
  const longSegs = segs.filter(([a, b]) => b - a >= 9 && b < LW - 20);
  const nPipes = ri(1, 2) + Math.round(d * 5);
  for (let k = 0; k < nPipes && longSegs.length; k++) {
    const [a, b] = longSegs[ri(0, longSegs.length - 1)];
    const px = ri(a + 3, b - 5);
    const h = ri(1, d > 0.4 ? 3 : 2);
    if (!cellsFree(px - 1, 8, px + 2, 12) || !groundSolid(px - 1, px + 2)) continue;
    if (rnd() < 0.7) pipeAt(px, h); else towerAt(px, Math.min(3, h + 1));
  }

  // 4) 1UP srdíčka (mají přednost před ostatními plošinami): 1. na schůdkové plošince (dosažitelné normálním skokem), další tajná – vyžadují dvojskok
  const nHearts = 1 + (n >= 8 ? 1 : 0) + (n >= 15 ? 1 : 0);
  for (let h = 0; h < nHearts; h++) {
    for (let tries = 0; tries < 800; tries++) {
      const px = ri(26, LW - 40), late = tries > 300;       // „late“ = kompaktnější varianta, když je na trati málo místa
      if (h === 0 && !late) {
        if (!groundSolid(px - 6, px + 12) || !cellsFree(px - 1, 5, px + 8, 12)) continue;
        brickRow(px, 10, 3); brickRow(px + 4, 7, 3); items.push(lifeItem(px + 5, 6)); break;
      } else if (h === 0) {
        if (!groundSolid(px - 1, px + 6) || !cellsFree(px - 1, 5, px + 6, 12)) continue;
        pipeAt(px, 3); brickRow(px + 3, 7, 3); items.push(lifeItem(px + 4, 6)); break;
      } else {
        if (!groundSolid(px - (late ? 1 : 6), px + (late ? 3 : 8)) || !cellsFree(px - 1, 5, px + 4, 12)) continue;
        brickRow(px, 8, 3); items.push(lifeItem(px + 1, 7)); break;
      }
    }
  }

  // 5) plošiny s bloky ?: nízké jen tam, kde nejsou poblíž díry (jinak by blokovaly skok)
  const plats = [];
  const nPlat = Math.round(LW / 12);
  for (let k = 0; k < nPlat; k++) {
    const len = ri(3, 5);
    const px = ri(14, LW - 24 - len);
    const low = rnd() < 0.6;
    const row = low ? ri(9, 10) : 7;
    if (low && !groundSolid(px - 6, px + len + 5)) continue;
    if (!cellsFree(px - 1, row - 2, px + len, low ? 12 : row + 1)) continue;
    for (let i = 0; i < len; i++) setT(px + i, row, rnd() < 0.28 - 0.12 * d ? '?' : 'B');
    if (rnd() < 0.6) coinRowAt(px, row - 1, len);
    plats.push({ x: px, row, len });
  }

  // 6) mince: oblouky nad děrami a řádky na zemi
  pits.forEach(([a, b]) => { const w = b - a + 1; for (let k = 0; k < w; k++) coinAt(a + k, 11 - Math.round(Math.sin((k + 0.5) / w * Math.PI) * 2)); });
  for (let k = 0; k < Math.round(LW / 25); k++) {
    const cx = ri(14, LW - 24);
    if (groundSolid(cx, cx + 2) && cellsFree(cx, 11, cx + 2, 12)) coinRowAt(cx, 12, 3);
  }

  // 7) checkpoint na bezpečném rovném místě
  checkpoint = { x: -99999, reached: true, spawnX: 2 * T };
  const okCp = c => groundSolid(c - 3, c + 2) && cellsFree(c - 1, 8, c + 2, 12);
  let cx = Math.floor(LW * 0.55), found = false;
  for (let c = cx; c < LW - 30 && !found; c++) if (okCp(c)) { cx = c; found = true; }
  for (let c = Math.floor(LW * 0.55); c > 20 && !found; c--) if (okCp(c)) { cx = c; found = true; }
  if (found) checkpoint = { x: cx * T, reached: false, spawnX: (cx - 2) * T };

  // 8) nepřátelé: čím vyšší level, tím víc a rychlejší; Pankáč od levelu 3
  const np = 6 + Math.round(d * 20), ns = n >= 3 ? 1 + Math.round(d * 7) : 0;
  const placed = [];
  const spotOK = tx => groundSolid(tx, tx + 1) && cellsFree(tx, 10, tx + 1, 12) && placed.every(p => Math.abs(p - tx) >= 3);
  const place = (count, fn) => {
    for (let i = 0, tries = 0; i < count && tries < 500; tries++) {
      const tx = ri(12, LW - 18);
      if (!spotOK(tx)) continue;
      placed.push(tx); fn(tx); i++;
    }
  };
  place(np, tx => pacAt(tx, 13, 1 + 0.6 * d, rnd() < 0.5 ? -1 : 1));
  place(ns, tx => stickAt(tx, 13, 1 + 0.5 * d, rnd() < 0.5 ? -1 : 1));
  plats.forEach(pl => { if (pl.len >= 4 && rnd() < 0.5 * d) pacAt(pl.x + 1, pl.row, 1 + 0.6 * d, rnd() < 0.5 ? -1 : 1); });
}

// Level 21: hradní aréna s velkým Mimoněm. Vlastnosti bosse (BOSS) doladíme později.
const BOSS = { hp: 6, speed: 1.3, rage: 2.4, jump: 150, hurt: 70 };

function buildBoss() {
  LW = 30;
  grid = Array.from({ length: LH }, () => Array(LW).fill(' '));
  resetWorld();
  groundCols(0, LW - 1);
  for (let y = 0; y < 13; y++) { setT(0, y, '#'); setT(LW - 1, y, '#'); }
  for (let x = 0; x < LW; x++) { setT(x, 0, '#'); setT(x, 1, '#'); }
  brickRow(4, 8, 4); brickRow(22, 8, 4); brickRow(13, 6, 4, 'B');
  coinRowAt(13, 5, 4);
  enemies.push({ type: 'boss', x: 20 * T, y: 13 * T - 96, w: 64, h: 96, vx: 0, vy: 0, dir: -1, dead: false, timer: 0,
                 anim: 0, hp: BOSS.hp, hurt: 0, jumpT: BOSS.jump, dying: false, spin: 0, dropped: false });
  items.push(lifeItem(5, 6));
  checkpoint = { x: -99999, reached: true, spawnX: 2 * T };
}

function buildLevel(n) {
  LV = { n, name: THEMES[n - 1].name, theme: THEMES[n - 1], boss: n === LEVEL_COUNT };
  if (n === 1) buildLevel1();
  else if (n === LEVEL_COUNT) buildBoss();
  else genLevel(n);
}

function startLevel(n) {
  G.level = n; buildLevel(n);
  P = newPlayer(2 * T);
  G.cam = 0; G.state = 'play'; G.paused = false; G.banner = 170;
}

function newPlayer(x) {
  return { x, y: GROUND_ROW * T - 28, w: 24, h: 28, vx: 0, vy: 0, face: 1, ground: false,
           coyote: 0, airJumped: false, fire: 0, wings: 0, wheels: 0, spin: 0, wrot: 0, hintCd: 0, invuln: 0, fireCd: 0, breath: 0, anim: 0 };
}
function newGame() {
  G.score = 0; G.coins = 0; G.lives = 3; G.time = 0; G.paused = false;
  startLevel(START_LEVEL);
}

// ============================================================
//  Fyzika a kolize
// ============================================================
function solidAt(tx, ty) {
  if (tx < 0 || tx >= LW) return true;
  if (ty < 0 || ty >= LH) return false;
  const t = grid[ty][tx];
  return t === '#' || t === 'B' || t === '?' || t === 'U' || t === 'T';
}

function moveBody(b) {
  const res = { hitX: false, ground: false, bumps: [] };
  // vodorovně
  b.x += b.vx;
  let y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = tx * T - b.w; b.vx = 0; res.hitX = true; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * T; b.vx = 0; res.hitX = true; break; }
  }
  // svisle
  b.y += b.vy;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { b.y = ty * T - b.h; b.vy = 0; res.ground = true; break; }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / T);
    let hit = false;
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { res.bumps.push({ tx, ty }); hit = true; }
    if (hit) { b.y = (ty + 1) * T; b.vy = 0; }
  }
  return res;
}

const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function popup(x, y, text, color = '#fff') {
  particles.push({ x, y, vx: 0, vy: -1.1, life: 40, text, color });
}
function puff(x, y, color, n = 6) {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: (Math.random() - .5) * 4, vy: -Math.random() * 3, life: 25, r: 2 + Math.random() * 3, color });
}

const BONUS_NAMES = { fire: 'OHEŇ! 60 s', wings: 'LÉTÁNÍ! 10 s', shroom: 'TRAKTOR! 30 s' };

function spawnBonus(tx, ty, forced) {
  // šance v procentech (součet 100)
  const bag = [['coin', 50], ['chest', 20], ['fire', 15], ['wings', 7.5], ['shroom', 7.5]];
  let type = forced;
  if (!type) {
    const pool = bag;
    let r = Math.random() * pool.reduce((sum, b) => sum + b[1], 0);
    for (const [name, w] of pool) { r -= w; if (r <= 0) { type = name; break; } }
    type = type || pool[0][0];
  }
  if (type === 'coin') {
    addCoin(); G.score += 100;
    popup(tx * T + 8, ty * T - 6, '+100', '#ffe066'); sfx.coin();
    puff(tx * T + 16, ty * T, '#ffd93b', 5);
    return;
  }
  items.push({ type, x: tx * T + 4, baseY: ty * T - 24, y: ty * T, w: 24, h: 24, t: 0, got: false });
  sfx.bump();
}

function giveLife() {
  if (G.lives < 9) G.lives++;
  popup(P.x - 12, P.y - 24, '+1 ŽIVOT', '#7dffb0'); sfx.power();
}
function addCoin() {
  G.coins++;
  if (G.coins % 50 === 0) giveLife();                  // každých 50 mincí = +1 život
}

function collectItem(it) {
  const p = P;
  if (it.type === 'life') { giveLife(); puff(it.x + 12, it.y + 12, '#ff6b8a', 10); return; }
  if (it.type === 'chest') {
    G.score += 500; popup(it.x, it.y - 8, '+500', '#ffe066'); sfx.coin(); sfx.power();
    puff(it.x + 12, it.y + 12, '#ffd93b', 10);
    return;
  }
  if (it.type === 'fire') p.fire = 3600;
  if (it.type === 'wings') p.wings = 600;
  if (it.type === 'shroom') p.wheels = 1800;
  G.score += 100;
  popup(it.x - 10, it.y - 10, BONUS_NAMES[it.type], '#7dffb0');
  sfx.power();
  puff(it.x + 12, it.y + 12, '#ffffff', 10);
}

// První zásah Pankáče vyděsí (utíká), druhý ho zničí. Vrací true, pokud přežil.
function stickHit(e) {
  if (e.stun > 0) return true;           // během vyděšeného třesu je nezranitelný
  if (e.hits >= 1) return false;
  e.hits = 1; e.panic = true; e.stun = 30;
  const dx = (e.x + e.w / 2) - (P.x + P.w / 2);
  e.dir = Math.abs(dx) > 6 ? (dx > 0 ? 1 : -1) : P.face;    // první směr úniku: pryč od dráčka (při skoku shora tam, kam kouká)
  G.score += 100; popup(e.x - 8, e.y - 20, 'ÁÁÁ!', '#ff8a8a'); sfx.scream();
  puff(e.x + 11, e.y + 8, '#ff6a6a', 8);
  return true;
}

function updateStick(e, p) {
  if (e.stun > 0) { e.stun--; if (e.stun === 0) e.grace = 20; e.vx = 0; e.anim += 0.5; return; }   // vyděšeně se třese
  if (e.grace > 0) e.grace--;
  if (e.panic) {
    e.anim += 0.9;                                                      // kmitající nožičky
    // na konci trati (u hrany díry) se otočí a utíká na druhou stranu; u zdi otáčí obecný kód níže
    const ax = Math.floor((e.x + (e.dir > 0 ? e.w + 4 : -4)) / T);
    const ay = Math.floor((e.y + e.h + 2) / T);
    if (e.vy < 1 && !solidAt(ax, ay)) e.dir *= -1;
    e.vx = e.dir * 3.6;
  } else {
    e.anim += 0.12;
    e.vx = e.dir * 0.7 * (e.spd || 1);
  }
}

function bossHit(e, dmg) {
  if (e.hurt > 0 || e.dying) return;
  e.hp -= dmg; e.hurt = BOSS.hurt;
  G.score += 300; popup(e.x + 14, e.y - 10, 'AU!', '#ffe066'); sfx.kill(); puff(e.x + 32, e.y + 24, '#f7d02c', 12);
  if (e.hp <= 0) { e.dying = true; e.timer = 100; e.vy = -6; popup(e.x - 10, e.y - 30, 'POTÁPĚN!', '#7dffb0'); }
}

function updateBoss(e, p) {
  if (e.dying) {
    e.timer--; e.spin += 0.22;
    if (e.timer <= 0) { e.dead = true; G.score += G.lives * 500; G.state = 'win'; sfx.win(); }
    return;
  }
  const rage = e.hp <= BOSS.hp / 2;
  e.anim += rage ? 0.22 : 0.12;
  if (e.hurt > 0) e.hurt--;
  if (rage && !e.dropped) { e.dropped = true; items.push(lifeItem(14, 10)); popup(e.x, e.y - 30, 'ZBĚSILÝ!', '#ff8a8a'); }
  const stunned = e.hurt > BOSS.hurt - 30;
  if (rage) e.dir = (p.x + p.w / 2) > (e.x + e.w / 2) ? 1 : -1;               // zuřivý Mimoň pronásleduje dráčka
  e.vx = stunned ? 0 : e.dir * (rage ? BOSS.rage : BOSS.speed);
  e.jumpT--;
  if (e.jumpT <= 0 && e.vy === 0 && !stunned) { e.vy = -11.5; e.jumpT = BOSS.jump + Math.floor(Math.random() * 60); }
  e.vy = Math.min(e.vy + 0.5, 12);
  const r = moveBody(e);
  if (r.hitX && !rage) e.dir *= -1;

  if (overlap(p, e) && e.hurt <= 0) {
    const stomp = p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 36;
    if (stomp) { bossHit(e, 1); p.vy = -11; }
    else if (p.wheels > 0) bossHit(e, 1);
    else if (p.invuln <= 0) loseLife(false);
  }
}

function loseLife(fell) {
  G.lives--;
  sfx.hurt();
  if (G.lives <= 0) { G.state = 'over'; sfx.over(); return; }
  if (fell) {
    const sx = checkpoint.reached ? checkpoint.spawnX : 2 * T;
    const old = P;
    P = newPlayer(sx);
    P.invuln = 90; P.fire = old.fire; P.wings = old.wings; P.wheels = old.wheels;
  } else {
    P.invuln = 120; P.vy = -6; P.vx = -P.face * 4;
  }
}

function updatePlay() {
  const p = P;
  G.time++;
  if (G.banner > 0) G.banner--;
  const left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;
  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  const jumpHeld = keys.ArrowUp || keys.KeyW || keys.Space;
  const fireKey = keys.ShiftLeft || keys.ShiftRight || keys.KeyF || keys.KeyX;

  // chůze
  const maxV = 3.3, accel = 0.5, fric = 0.4;
  if (p.invuln < 105 || p.vy >= 0 || true) {
    if (dir) { p.vx = clamp(p.vx + dir * accel * (p.ground ? 1 : 0.85), -maxV, maxV); p.face = dir; }
    else if (Math.abs(p.vx) < fric) p.vx = 0;
    else p.vx -= Math.sign(p.vx) * fric * (p.ground ? 1 : 0.25);
  }

  const upKey = keys.ArrowUp || keys.KeyW || keys.Space;
  const downKey = keys.ArrowDown || keys.KeyS;
  if (p.wings > 0) {
    // létání: dračí ocas se točí, nahoru a dolů se pohybuje libovolně
    const want = upKey ? -3.4 : downKey ? 3.4 : (p.ground ? 1 : 0);
    p.vy += (want - p.vy) * 0.25;
    p.coyote = 0; jumpBuf = 0; p.airJumped = false;
  } else {
  // skok (coyote time + buffer)
  p.coyote = p.ground ? 6 : p.coyote - 1;
  if (jumpBuf > 0) jumpBuf--;
  if (p.ground) p.airJumped = false;
  if (jumpBuf > 0 && p.coyote > 0) { p.vy = -11; p.coyote = 0; jumpBuf = 0; p.ground = false; sfx.jump(); }
  // dvojitý skok: druhé zmáčknutí skoku ve vzduchu = další odraz výš
  else if (jumpBuf > 0 && !p.ground && !p.airJumped) {
    p.vy = -10.5; p.airJumped = true; jumpBuf = 0; sfx.jump2();
    puff(p.x + p.w / 2, p.y + p.h, '#ffffff', 8);
  }

  // gravitace (kratší skok při puštění klávesy)
  const g = (p.vy < 0 && !jumpHeld) ? 1.3 : 0.5;
  p.vy = Math.min(p.vy + g, 12);
  }

  const res = moveBody(p);
  p.ground = res.ground;
  if (p.wings > 0 && p.y < 0) { p.y = 0; p.vy = 0; }
  p.wrot += p.vx * p.face / 8;
  if (Math.abs(p.vx) > 0.1 && p.ground) p.anim += Math.abs(p.vx) * 0.12;

  // hlavou do bloku
  if (res.bumps.length) {
    const cx = p.x + p.w / 2;
    res.bumps.sort((a, b) => Math.abs(a.tx * T + 16 - cx) - Math.abs(b.tx * T + 16 - cx));
    const { tx, ty } = res.bumps[0];
    const t = grid[ty][tx];
    if (t === '?' || t === 'B') {
      bumps[tx + ',' + ty] = 10;
      if (t === '?') {
        grid[ty][tx] = 'U'; spawnBonus(tx, ty);
      } else sfx.bump();
    }
  }

  // oheň
  if (p.fireCd > 0) p.fireCd--;
  if (p.breath > 0) p.breath--;
  if (fireKey && p.fire > 0 && p.fireCd <= 0) {
    fireballs.push({ x: p.x + (p.face > 0 ? p.w : -10), y: p.y + 6, w: 10, h: 10, vx: p.face * 6 + p.vx * 0.3, vy: 0, life: 110 });
    p.fireCd = 22; p.breath = 10; sfx.fire();
  }
  if (p.invuln > 0) p.invuln--;
  if (p.fire > 0) p.fire--;
  if (p.wings > 0) { p.wings--; p.spin += 0.7; }
  if (p.wheels > 0) p.wheels--;
  if (fireKey && p.fire <= 0 && p.hintCd <= 0) { p.hintCd = 240; popup(p.x - 10, p.y - 14, 'Oheň je v ? blocích', '#ffb27a'); }
  if (p.hintCd > 0) p.hintCd--;

  // ohňové koule
  for (const f of fireballs) {
    f.vy = Math.min(f.vy + 0.4, 8);
    const r = moveBody(f);
    if (r.ground) f.vy = -5;
    if (r.hitX) f.life = 0;
    f.life--;
    for (const e of enemies) {
      if (!e.dead && overlap(f, e)) {
        if (e.type === 'boss') { bossHit(e, 1); f.life = 0; continue; }
        if (e.type === 'stick' && stickHit(e)) { f.life = 0; continue; }
        e.dead = true; e.timer = 40; e.shot = true; e.vy = -5; f.life = 0;
        G.score += 200; popup(e.x, e.y - 8, '+200', '#ff9f43'); sfx.kill(); puff(e.x + 14, e.y + 10, '#ff7a1a', 8);
      }
    }
    if (f.y > LH * T) f.life = 0;
  }
  fireballs = fireballs.filter(f => f.life > 0);

  // nepřátelé
  const camL = G.cam - 100, camR = G.cam + VW + 100;
  for (const e of enemies) {
    if (e.dead) {
      e.timer--;
      if (e.shot) { e.vy += 0.5; e.y += e.vy; e.x += e.dir * 1.5; }
      continue;
    }
    if (e.type === 'boss') { updateBoss(e, p); if (G.state !== 'play') return; continue; }
    if (e.x + e.w < camL || e.x > camR) continue;       // mimo dosah
    if (e.type === 'stick') updateStick(e, p);
    else { e.anim += 0.14; e.vx = e.dir * 1.0 * (e.spd || 1); }
    e.vy = Math.min(e.vy + 0.5, 10);
    const r = moveBody(e);
    if (r.hitX) e.dir *= -1;
    if (r.ground) {
      const tx = Math.floor((e.x + (e.dir > 0 ? e.w + 2 : -2)) / T);
      const ty = Math.floor((e.y + e.h + 2) / T);
      if (!solidAt(tx, ty)) e.dir *= -1;
    }
    if (e.y > LH * T + 100) { e.dead = true; e.timer = 0; }

    if (overlap(p, e) && !(e.type === 'stick' && e.stun > 0)) {
      const stomp = p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 12;
      if (stomp && e.type === 'stick' && stickHit(e)) {
        p.vy = jumpHeld ? -10 : -7;                       // první skok: Pankáč se vyděsí a uteče
      } else if (stomp) {
        e.dead = true; e.timer = 30;
        p.vy = jumpHeld ? -10 : -7;
        G.score += 100; popup(e.x, e.y - 8, '+100'); sfx.stomp(); puff(e.x + 14, e.y + e.h, '#ffd93b', 6);
      } else if (e.grace > 0) {
        // krátce po vyděšení Pankáč ještě neubližuje, aby dráčka nezranil při rozběhu
      } else if (p.wheels > 0 && e.type === 'stick' && stickHit(e)) {
        // traktor: první přejetí Pankáče jen vyděsí
      } else if (p.wheels > 0) {
        e.dead = true; e.timer = 30;
        G.score += 100; popup(e.x, e.y - 8, '+100', '#ffb27a'); sfx.stomp(); puff(e.x + 14, e.y + e.h, '#ffd93b', 8);
      } else if (p.invuln <= 0) {
        loseLife(false);
        if (G.state !== 'play') return;
      }
    }
  }
  enemies = enemies.filter(e => !(e.dead && e.timer <= 0));

  // bonusy
  for (const it of items) {
    it.t++;
    it.y = it.baseY + 24 * (1 - Math.min(1, it.t / 14));
    if (it.t > 8 && !it.got && overlap(p, it)) { it.got = true; collectItem(it); }
  }
  items = items.filter(it => !it.got);

  // mince
  for (const c of coinsList) {
    if (!c.got && overlap(p, c)) {
      c.got = true; addCoin(); G.score += 50; sfx.coin();
      popup(c.x, c.y - 4, '+50', '#ffe066');
    }
  }

  // checkpoint
  if (!checkpoint.reached && p.x > checkpoint.x) {
    checkpoint.reached = true; sfx.check(); popup(p.x, p.y - 20, 'Checkpoint!', '#7dffb0');
  }

  // pád do díry
  if (p.y > LH * T + 60) loseLife(true);

  // cíl
  if (G.state === 'play' && !LV.boss && p.x + p.w > flagX()) {
    G.clearBonus = 500 + G.level * 100; G.score += G.clearBonus; G.state = 'clear'; sfx.win();
  }

  // částice
  for (const q of particles) {
    q.x += q.vx; q.y += q.vy; if (!q.text) q.vy += 0.25; q.life--;
  }
  particles = particles.filter(q => q.life > 0);
  for (const k in bumps) { bumps[k]--; if (bumps[k] <= 0) delete bumps[k]; }

  // kamera
  const target = clamp(p.x - VW * 0.4, 0, LW * T - VW);
  G.cam += (target - G.cam) * 0.15;
}

const mod = (v, n) => ((v % n) + n) % n;

function drawAmbient(a) {
  const t = G.time;
  ctx.save();
  if (a.t === 'clouds') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 12; i++) {
      const x = mod(i * 330 - G.cam * 0.4, 12 * 330) - 150, y = 40 + (i * 53) % 110;
      ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.arc(x + 24, y - 8, 26, 0, 7); ctx.arc(x + 52, y, 20, 0, 7); ctx.fill();
    }
  } else if (a.t === 'stars') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 80; i++) {
      const x = mod(i * 137 - G.cam * 0.05, VW), y = (i * 71) % 330, sz = 1 + (i % 3) * 0.7;
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.04 + i));
      ctx.fillRect(x, y, sz, sz);
    }
  } else if (a.t === 'snow') {
    ctx.fillStyle = a.c; ctx.globalAlpha = 0.85;
    for (let i = 0; i < 80; i++) {
      const x = mod(i * 113 + Math.sin(t * 0.02 + i) * 22 - G.cam * 0.25, VW), y = mod(i * 47 + t * (0.7 + (i % 4) * 0.3), VH);
      ctx.beginPath(); ctx.arc(x, y, 1.4 + (i % 3) * 0.8, 0, 7); ctx.fill();
    }
  } else if (a.t === 'embers') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 40; i++) {
      const x = mod(i * 89 + Math.sin(t * 0.03 + i) * 16 - G.cam * 0.3, VW), y = VH - mod(i * 61 + t * (0.6 + (i % 5) * 0.25), VH);
      ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(t * 0.07 + i));
      ctx.fillRect(x, y, 2.5, 2.5);
    }
  } else if (a.t === 'bubbles') {
    ctx.strokeStyle = a.c; ctx.lineWidth = 1.4;
    for (let i = 0; i < 30; i++) {
      const x = mod(i * 97 + Math.sin(t * 0.03 + i) * 10 - G.cam * 0.3, VW), y = VH - mod(i * 53 + t * (0.5 + (i % 4) * 0.25), VH);
      ctx.beginPath(); ctx.arc(x, y, 2 + (i % 4) * 1.6, 0, 7); ctx.stroke();
    }
  } else if (a.t === 'leaves') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 28; i++) {
      const x = mod(i * 131 + Math.sin(t * 0.025 + i) * 30 - G.cam * 0.35, VW), y = mod(i * 59 + t * (0.7 + (i % 3) * 0.3), VH);
      ctx.beginPath(); ctx.ellipse(x, y, 4, 2, t * 0.04 + i, 0, 7); ctx.fill();
    }
  } else if (a.t === 'dust') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 26; i++) {
      const x = mod(i * 151 - t * (1.5 + (i % 3)) - G.cam * 0.5, VW), y = 140 + (i * 37) % 300;
      ctx.fillRect(x, y, 14 + (i % 3) * 8, 1.6);
    }
  } else if (a.t === 'fog') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 7; i++) {
      const x = mod(i * 190 + t * 0.25 - G.cam * 0.4, VW + 300) - 150, y = 290 + (i * 41) % 110;
      ctx.beginPath(); ctx.ellipse(x, y, 150, 28, 0, 0, 7); ctx.fill();
    }
  } else if (a.t === 'sparks') {
    ctx.fillStyle = a.c;
    for (let i = 0; i < 45; i++) {
      const x = mod(i * 127 - G.cam * 0.15, VW), y = (i * 67) % 400;
      ctx.globalAlpha = Math.max(0, Math.sin(t * 0.05 + i * 1.7));
      ctx.fillRect(x - 1, y - 3, 2, 6); ctx.fillRect(x - 3, y - 1, 6, 2);
    }
  } else if (a.t === 'confetti') {
    const cols = ['#ff6b9d', '#ffd93b', '#6bd6ff', '#9bff6b', '#c79bff'];
    for (let i = 0; i < 45; i++) {
      const x = mod(i * 109 + Math.sin(t * 0.03 + i) * 18 - G.cam * 0.3, VW), y = mod(i * 43 + t * (0.6 + (i % 3) * 0.3), VH);
      ctx.fillStyle = cols[i % 5]; ctx.fillRect(x, y, 4, 7);
    }
  }
  ctx.restore();
}

function drawFarLayer(L) {
  const w = L.w, par = G.cam * L.k, base = GROUND_ROW * T + 2;
  const first = Math.floor(par / w) - 1, cnt = Math.ceil(VW / w) + 3;
  for (let j = 0; j < cnt; j++) {
    const idx = first + j, x = idx * w - par;
    const h = L.h * (0.7 + 0.3 * (mod(idx, 7) / 6));
    ctx.fillStyle = L.c;
    switch (L.s) {
      case 'hills':
        ctx.beginPath(); ctx.ellipse(x + w / 2, base, w / 2, h, 0, Math.PI, 0); ctx.fill(); break;
      case 'dunes':
        ctx.beginPath(); ctx.moveTo(x - 2, base); ctx.quadraticCurveTo(x + w * 0.4, base - h * 1.9, x + w + 2, base); ctx.fill(); break;
      case 'mountains':
        ctx.beginPath(); ctx.moveTo(x - 10, base); ctx.lineTo(x + w * 0.45, base - h * 1.1); ctx.lineTo(x + w * 0.62, base - h * 0.75);
        ctx.lineTo(x + w * 0.78, base - h * 0.95); ctx.lineTo(x + w + 10, base); ctx.fill();
        if (L.cap) {
          ctx.fillStyle = L.cap; ctx.beginPath(); ctx.moveTo(x + w * 0.45, base - h * 1.1); ctx.lineTo(x + w * 0.37, base - h * 0.84);
          ctx.lineTo(x + w * 0.45, base - h * 0.9); ctx.lineTo(x + w * 0.53, base - h * 0.82); ctx.fill();
        }
        break;
      case 'pines':
        for (let k = 0; k < 3; k++) {
          const by = base - k * h * 0.26, hw = w * 0.36 * (1 - k * 0.2);
          ctx.beginPath(); ctx.moveTo(x + w / 2 - hw, by); ctx.lineTo(x + w / 2, by - h * 0.5); ctx.lineTo(x + w / 2 + hw, by); ctx.fill();
        }
        ctx.fillRect(x + w / 2 - 3, base - 6, 6, 8); break;
      case 'trees':
        ctx.fillRect(x + w / 2 - 4, base - h * 0.5, 8, h * 0.5);
        ctx.beginPath(); ctx.arc(x + w / 2, base - h * 0.62, w * 0.36, 0, 7); ctx.arc(x + w * 0.3, base - h * 0.5, w * 0.25, 0, 7);
        ctx.arc(x + w * 0.72, base - h * 0.5, w * 0.25, 0, 7); ctx.fill(); break;
      case 'city': {
        const bh = h * 1.2;
        ctx.fillRect(x + 4, base - bh, w - 8, bh);
        ctx.fillStyle = L.win || '#ffd86b';
        for (let r = 0; r < Math.floor(bh / 18) - 1; r++) for (let c = 0; c < 3; c++)
          if (mod(idx * 7 + r * 3 + c * 5, 3) === 0) ctx.fillRect(x + 12 + c * ((w - 32) / 3 + 3), base - bh + 12 + r * 18, 6, 8);
        break; }
      case 'crystals':
        for (let k = 0; k < 3; k++) {
          const cx = x + w * (0.2 + 0.3 * k), sh = h * (0.55 + 0.45 * mod(idx + k, 3) / 2);
          ctx.beginPath(); ctx.moveTo(cx - w * 0.09, base); ctx.lineTo(cx, base - sh); ctx.lineTo(cx + w * 0.09, base); ctx.fill();
        }
        break;
      case 'stal':
        ctx.beginPath(); ctx.moveTo(x + w * 0.15, -2); ctx.lineTo(x + w * 0.35, h * 0.9); ctx.lineTo(x + w * 0.55, -2);
        ctx.moveTo(x + w * 0.6, -2); ctx.lineTo(x + w * 0.75, h * 0.55); ctx.lineTo(x + w * 0.9, -2); ctx.fill(); break;
      case 'castle': {
        const th = h * 1.25, bx = x + w * 0.2, bw = w * 0.6;
        ctx.fillRect(bx, base - th, bw, th);
        for (let k = 0; k < 3; k++) ctx.fillRect(bx + k * (bw / 3) + 1, base - th - 10, bw / 3 - 4, 12);
        ctx.fillStyle = L.win || '#000';
        ctx.beginPath(); ctx.moveTo(x + w * 0.45, base - th * 0.5); ctx.lineTo(x + w * 0.45, base - th * 0.7);
        ctx.arc(x + w * 0.5, base - th * 0.7, w * 0.05, Math.PI, 0); ctx.lineTo(x + w * 0.55, base - th * 0.5); ctx.fill();
        break; }
      case 'graves':
        for (let k = 0; k < 3; k++) {
          const gx = x + w * (0.15 + 0.3 * k), gh = h * (0.5 + 0.25 * (k % 2));
          ctx.fillRect(gx, base - gh, w * 0.16, gh);
          ctx.beginPath(); ctx.arc(gx + w * 0.08, base - gh, w * 0.08, Math.PI, 0); ctx.fill();
          if (k === 1) { ctx.fillRect(gx + w * 0.08 - 2, base - gh - w * 0.22, 4, w * 0.22); ctx.fillRect(gx + w * 0.08 - 7, base - gh - w * 0.15, 14, 4); }
        }
        break;
      case 'factory': {
        ctx.fillRect(x + 6, base - h, w - 30, h); ctx.fillRect(x + w - 22, base - h * 1.6, 12, h * 1.6);
        ctx.fillStyle = 'rgba(180,180,190,.35)';
        const sm = Math.sin(G.time * 0.02 + idx);
        ctx.beginPath(); ctx.arc(x + w - 16 + sm * 6, base - h * 1.6 - 14, 12, 0, 7); ctx.arc(x + w - 8 + sm * 10, base - h * 1.6 - 34, 16, 0, 7); ctx.fill();
        break; }
    }
  }
}

function drawPit() {
  const p = LV.theme.pit;
  if (!p) return;
  const y0 = GROUND_ROW * T + 14;
  const gr = ctx.createLinearGradient(0, y0, 0, VH);
  gr.addColorStop(0, p.c1); gr.addColorStop(1, p.c2);
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(0, VH);
  for (let x = 0; x <= VW; x += 8) ctx.lineTo(x, y0 + Math.sin((x + G.cam) * 0.06 + G.time * 0.08) * p.wave);
  ctx.lineTo(VW, VH); ctx.closePath(); ctx.fill();
}

function drawCastleDeco() {
  const t = G.time;
  for (const tx of [7, 15, 23]) {                                   // gotická okna s měsícem
    const x = tx * T + 16 - G.cam;
    ctx.fillStyle = '#07040e';
    ctx.beginPath(); ctx.moveTo(x - 20, 6 * T); ctx.lineTo(x - 20, 3 * T); ctx.arc(x, 3 * T, 20, Math.PI, 0); ctx.lineTo(x + 20, 6 * T); ctx.fill();
    ctx.fillStyle = 'rgba(110,140,255,.28)';
    ctx.beginPath(); ctx.moveTo(x - 14, 6 * T); ctx.lineTo(x - 14, 3 * T); ctx.arc(x, 3 * T, 14, Math.PI, 0); ctx.lineTo(x + 14, 6 * T); ctx.fill();
    ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(x + 4, 3 * T - 6, 6, 0, 7); ctx.fill();
  }
  for (const tx of [11, 19]) {                                       // červené prapory
    const x = tx * T + 16 - G.cam;
    ctx.fillStyle = '#8a1a2a'; ctx.fillRect(x - 14, 2 * T, 28, 78);
    ctx.beginPath(); ctx.moveTo(x - 14, 2 * T + 78); ctx.lineTo(x, 2 * T + 62); ctx.lineTo(x + 14, 2 * T + 78); ctx.fill();
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(x, 2 * T + 26, 7, 0, 7); ctx.fill();
  }
  for (const tx of [3, 11, 19, 27]) {                                // pochodně
    const x = tx * T + 16 - G.cam, y = 8 * T, f = Math.sin(t * 0.3 + tx) * 2;
    const gl = ctx.createRadialGradient(x, y - 6, 4, x, y - 6, 70);
    gl.addColorStop(0, 'rgba(255,160,60,.35)'); gl.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y - 6, 70, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(x - 3, y, 6, 20);
    ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.quadraticCurveTo(x - 9, y - 12, x + f, y - 24); ctx.quadraticCurveTo(x + 9, y - 12, x + 7, y); ctx.fill();
    ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.quadraticCurveTo(x - 4, y - 8, x + f * 0.6, y - 15); ctx.quadraticCurveTo(x + 4, y - 8, x + 4, y); ctx.fill();
  }
}

function drawBackground() {
  const th = LV.theme;
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  if (th.body) {
    const b = th.body;
    ctx.fillStyle = b.c1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = b.c2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.74, 0, 7); ctx.fill();
  }
  const behind = th.amb.t === 'clouds' || th.amb.t === 'stars';
  if (behind) drawAmbient(th.amb);
  for (const L of th.far) drawFarLayer(L);
  if (!behind) drawAmbient(th.amb);
  if (LV.boss) drawCastleDeco();
  drawPit();
}

function drawTiles() {
  const th = LV.theme, gd = th.gnd, bk = th.brk, pp = th.pipe;
  const x0 = Math.floor(G.cam / T), x1 = x0 + Math.ceil(VW / T) + 1;
  for (let ty = 0; ty < LH; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (tx < 0 || tx >= LW) continue;
      const t = grid[ty][tx];
      if (t === ' ') continue;
      const px = Math.round(tx * T - G.cam);
      let py = ty * T;
      const b = bumps[tx + ',' + ty];
      if (b) py -= Math.sin((b / 10) * Math.PI) * 7;

      if (t === '#') {
        ctx.fillStyle = gd.fill; ctx.fillRect(px, py, T, T);
        ctx.fillStyle = gd.dot;
        ctx.fillRect(px + 6, py + 12, 4, 4); ctx.fillRect(px + 20, py + 22, 5, 4); ctx.fillRect(px + 14, py + 6, 3, 3);
        const open = ty === 0 || grid[ty - 1][tx] === ' ';
        if (gd.cap === 'stone') {
          ctx.fillStyle = gd.hi; ctx.fillRect(px, py, T, 2); ctx.fillRect(px, py + 15, T, 1);
          ctx.fillStyle = gd.top; ctx.fillRect(px + (ty % 2 ? 8 : 20), py, 1, 15); ctx.fillRect(px + (ty % 2 ? 22 : 10), py + 16, 1, 16);
        } else if (open) {
          ctx.fillStyle = gd.top; ctx.fillRect(px, py, T, gd.cap === 'flat' ? 7 : 9);
          ctx.fillStyle = gd.hi; ctx.fillRect(px, py, T, 3);
          if (gd.cap === 'grass') { ctx.fillStyle = gd.top; for (let i = 0; i < 4; i++) ctx.fillRect(px + i * 8 + 2, py + 9, 4, 4); }
          else if (gd.cap === 'snow' || gd.cap === 'drip') {
            ctx.fillStyle = gd.top;
            for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(px + i * 8 + 4, py + 8, 4, 0, Math.PI); ctx.fill(); }
          }
        }
      } else if (t === 'B') {
        ctx.fillStyle = bk.fill; ctx.fillRect(px, py, T, T);
        ctx.fillStyle = bk.line;
        ctx.fillRect(px, py + 15, T, 2); ctx.fillRect(px, py, T, 2); ctx.fillRect(px, py + T - 2, T, 2);
        ctx.fillRect(px + 15, py, 2, 16); ctx.fillRect(px + 7, py + 16, 2, 16); ctx.fillRect(px + 23, py + 16, 2, 16);
        ctx.fillStyle = bk.hi; ctx.fillRect(px + 2, py + 2, 12, 2);
      } else if (t === '?') {
        ctx.fillStyle = '#e8a90c'; ctx.fillRect(px, py, T, T);
        ctx.fillStyle = '#ffd93b'; ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
        ctx.fillStyle = '#b57d00';
        [[3, 3], [T - 6, 3], [3, T - 6], [T - 6, T - 6]].forEach(([a, c]) => ctx.fillRect(px + a, py + c, 3, 3));
        ctx.fillStyle = '#8a5a00'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('?', px + 16, py + 24);
      } else if (t === 'U') {
        ctx.fillStyle = '#8d7b68'; ctx.fillRect(px, py, T, T);
        ctx.fillStyle = '#6e5f4f'; ctx.fillRect(px + 3, py + 3, T - 6, T - 6);
        ctx.fillStyle = '#8d7b68'; ctx.fillRect(px + 5, py + 5, T - 10, T - 10);
      } else if (t === 'T') {
        const cap = grid[ty - 1]?.[tx] !== 'T';
        const leftEdge = grid[ty][tx - 1] !== 'T';
        ctx.fillStyle = pp.fill; ctx.fillRect(px, py, T, T);
        ctx.fillStyle = pp.light; ctx.fillRect(px + (leftEdge ? 5 : 0), py, 5, T);
        ctx.fillStyle = pp.dark; ctx.fillRect(px + (leftEdge ? 0 : T - 4), py, 4, T);
        if (cap) {
          ctx.fillStyle = pp.dark; ctx.fillRect(px - (leftEdge ? 2 : 0), py, T + (leftEdge ? 0 : 2), 12);
          ctx.fillStyle = pp.fill; ctx.fillRect(px + 1 - (leftEdge ? 1 : 0), py + 2, T - 2 + (leftEdge ? 0 : 1), 8);
          ctx.fillStyle = pp.light; ctx.fillRect(px + (leftEdge ? 4 : 0), py + 2, 5, 8);
        }
      }
    }
  }
}

function drawItems() {
  for (const it of items) {
    const sx = Math.round(it.x - G.cam);
    if (sx < -40 || sx > VW + 40) continue;
    const ready = it.t > 14;
    const sy = Math.round(it.y + (ready ? Math.sin(G.time * 0.1) * 2 : 0));
    if (ready) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.22 + 0.12 * Math.sin(G.time * 0.15)) + ')';
      ctx.beginPath(); ctx.arc(sx + 12, sy + 12, 19, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.translate(sx, sy);
    if (it.type === 'life') {
      ctx.fillStyle = '#ff3b5c';
      ctx.beginPath(); ctx.moveTo(12, 22); ctx.bezierCurveTo(-6, 9, 3, -3, 12, 6); ctx.bezierCurveTo(21, -3, 30, 9, 12, 22); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(7, 7, 2.6, 1.6, -0.6, 0, 7); ctx.fill();
      ctx.fillStyle = '#7dffb0'; ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.fillText('1UP', 12, -3);
    } else if (it.type === 'chest') {
      ctx.fillStyle = '#7a4a22'; ctx.fillRect(1, 10, 22, 13);
      ctx.fillStyle = '#a8692f'; ctx.fillRect(2, 11, 20, 11);
      ctx.fillStyle = '#b97a3d';
      ctx.beginPath(); ctx.moveTo(1, 11); ctx.lineTo(1, 8); ctx.quadraticCurveTo(12, -3, 23, 8); ctx.lineTo(23, 11); ctx.fill();
      ctx.fillStyle = '#e0b941';
      ctx.fillRect(4, 5, 3, 18); ctx.fillRect(17, 5, 3, 18); ctx.fillRect(1, 10, 22, 2);
      ctx.fillStyle = '#ffd93b'; ctx.fillRect(10, 11, 4, 6);
      ctx.fillStyle = '#6b4a00'; ctx.fillRect(11.5, 13, 1, 3);
    } else if (it.type === 'fire') {
      const f = Math.sin(G.time * 0.4) * 1.5;
      ctx.strokeStyle = '#6b3f1d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(3, 22); ctx.lineTo(21, 17); ctx.moveTo(3, 17); ctx.lineTo(21, 22); ctx.stroke();
      ctx.fillStyle = '#ff5a1f';
      ctx.beginPath(); ctx.moveTo(4, 19); ctx.quadraticCurveTo(2, 9, 12, -1 + f); ctx.quadraticCurveTo(22, 9, 20, 19); ctx.fill();
      ctx.fillStyle = '#ffb02e';
      ctx.beginPath(); ctx.moveTo(8, 18); ctx.quadraticCurveTo(7, 11, 12, 5 + f); ctx.quadraticCurveTo(17, 11, 16, 18); ctx.fill();
      ctx.fillStyle = '#fff3a0';
      ctx.beginPath(); ctx.moveTo(10.5, 18); ctx.quadraticCurveTo(10, 14, 12, 11); ctx.quadraticCurveTo(14, 14, 13.5, 18); ctx.fill();
    } else if (it.type === 'wings') {
      ctx.strokeStyle = '#3cb44b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(3, 21); ctx.quadraticCurveTo(3, 7, 17, 7); ctx.stroke();
      ctx.strokeStyle = '#7fd68b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(4, 20); ctx.quadraticCurveTo(4, 9, 15, 8); ctx.stroke();
      ctx.fillStyle = '#ff8c42';
      ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(24, 7); ctx.lineTo(17, 14); ctx.lineTo(19, 7); ctx.fill();
    } else if (it.type === 'shroom') {
      ctx.fillStyle = '#f2e3c6'; ctx.fillRect(7, 13, 10, 10);
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.arc(12, 14, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7, 9, 2.6, 0, 7); ctx.arc(16.5, 8, 3, 0, 7); ctx.arc(12, 12.5, 1.8, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawCoins() {
  const t = G.time;
  for (const c of coinsList) {
    if (c.got) continue;
    const sx = c.x - G.cam;
    if (sx < -30 || sx > VW + 30) continue;
    const w = Math.abs(Math.cos(t * 0.07 + c.x * 0.05)) * 7 + 2;
    ctx.fillStyle = '#c99700';
    ctx.beginPath(); ctx.ellipse(sx + 8, c.y + 10, w + 1.5, 10.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.ellipse(sx + 8, c.y + 10, w, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3a0'; ctx.fillRect(sx + 8 - w / 3, c.y + 5, Math.max(1, w / 3), 8);
  }
}

function drawFlags() {
  if (LV.boss) return;
  // checkpoint
  const cx = checkpoint.x - G.cam;
  ctx.fillStyle = '#777'; ctx.fillRect(cx, 9 * T + 8, 4, 4 * T - 8 - 0);
  ctx.fillStyle = checkpoint.reached ? '#38d27a' : '#ff6b6b';
  ctx.beginPath(); ctx.moveTo(cx + 4, 9 * T + 8); ctx.lineTo(cx + 30, 9 * T + 20); ctx.lineTo(cx + 4, 9 * T + 32); ctx.fill();

  // cíl
  const fx = flagX() - G.cam;
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(fx + 14, 3 * T, 5, 10 * T);
  ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(fx + 16.5, 3 * T - 4, 7, 0, 7); ctx.fill();
  const wave = Math.sin(G.time * 0.1) * 3;
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(fx + 19, 3 * T + 4);
  ctx.quadraticCurveTo(fx + 40, 3 * T + 8 + wave, fx + 62, 3 * T + 22 + wave);
  ctx.quadraticCurveTo(fx + 40, 3 * T + 30 - wave, fx + 19, 3 * T + 40);
  ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('CÍL', fx + 26, 3 * T + 26);
}

function drawWheel(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#1b1b1f'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3a44';
  for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.fillRect(-1.4, -r - 0.6, 2.8, 3); }
  ctx.fillStyle = '#f2b705'; ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a77d00'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(r * 0.5, 0); ctx.moveTo(0, -r * 0.5); ctx.lineTo(0, r * 0.5); ctx.stroke();
  ctx.fillStyle = '#5a4300'; ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, 7); ctx.fill();
  ctx.restore();
}

function drawDragon(cx, bottom, face, phase, airborne, vy, breath, scale = 1, blink = false, fx = {}) {
  ctx.save();
  ctx.translate(cx, bottom);
  ctx.scale(face * scale, scale);

  const green = '#3cb44b', dark = '#2a8f39', belly = '#f6e58d', accent = '#ff8c42';
  const legSwing = airborne ? 0 : Math.sin(phase * 2) * 4;

  // ocas (při létání se točí jako vrtule)
  ctx.save();
  if (fx.flying) { ctx.translate(-7, -11); ctx.rotate(fx.spin); ctx.scale(1.3, 1.3); ctx.translate(7, 11); }
  ctx.fillStyle = green;
  ctx.beginPath();
  ctx.moveTo(-8, -10);
  ctx.quadraticCurveTo(-20, -4 + Math.sin(phase) * 2, -24, -13);
  ctx.quadraticCurveTo(-16, -9, -6, -16);
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.moveTo(-24, -13); ctx.lineTo(-27, -19); ctx.lineTo(-20, -15); ctx.fill();

  ctx.restore();

  // křídlo (za tělem)
  const flap = airborne ? (vy < 0 ? -1 : 0.4) : Math.sin(phase * 0.6) * 0.15;
  ctx.fillStyle = '#7fd68b';
  ctx.beginPath();
  ctx.moveTo(-4, -17);
  ctx.lineTo(-17, -29 - flap * 8);
  ctx.lineTo(-10, -20 - flap * 4);
  ctx.lineTo(-4, -27 - flap * 8);
  ctx.lineTo(0, -16);
  ctx.fill();
  ctx.fillStyle = dark;
  ctx.fillRect(-4, -19, 3, 3);

  // zadní nohy (s traktorem je nahradí kola)
  if (!fx.wheels) {
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(-4 + legSwing, -3, 5, 3.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = green;
    ctx.beginPath(); ctx.ellipse(6 - legSwing, -3, 5.5, 3.6, 0, 0, 7); ctx.fill();
  }

  // tělo + bříško
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(0, -13, 11, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(3, -11, 6.5, 8.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d9c46a'; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(0, -16 + i * 4); ctx.lineTo(7, -16 + i * 4); ctx.stroke(); }

  // hřbetní ostny
  ctx.fillStyle = accent;
  for (let i = 0; i < 3; i++) {
    const x = -10 + i * 0.5 - i * 1.5, y = -17 - i * 4;
    ctx.beginPath(); ctx.moveTo(x - 2, y + 4); ctx.lineTo(x - 6, y); ctx.lineTo(x, y - 2); ctx.fill();
  }

  // traktorová kola
  if (fx.wheels) { drawWheel(-5, -9, 9, fx.wheelRot || 0); drawWheel(9, -6.5, 6.5, (fx.wheelRot || 0) * 1.4); }

  // ručička
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(8, -11, 3, 2.4, 0.4, 0, 7); ctx.fill();

  // hlava
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.arc(5, -22, 8.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -20, 6.5, 5, 0, 0, 7); ctx.fill();   // čumák
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(16, -22, 1, 0, 7); ctx.fill();                 // nozdra
  // rohy
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-3, -35); ctx.lineTo(4, -29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -30); ctx.lineTo(5, -37); ctx.lineTo(10, -29); ctx.fill();
  // oko
  if (blink) {
    ctx.strokeStyle = '#123'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(5, -23); ctx.lineTo(11, -23); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -24, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(9.4, -24, 1.9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(9.6, -25.4, 1, 1);
  }
  // tvářička
  ctx.fillStyle = 'rgba(255,120,120,.55)';
  ctx.beginPath(); ctx.arc(7, -18, 2.2, 0, 7); ctx.fill();

  // oheň z tlamy
  if (breath > 0) {
    const s = breath / 10;
    ctx.fillStyle = '#ff5a1f';
    ctx.beginPath(); ctx.moveTo(19, -20); ctx.lineTo(19 + 14 * s, -26); ctx.lineTo(19 + 20 * s, -20); ctx.lineTo(19 + 14 * s, -15); ctx.fill();
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.moveTo(19, -20); ctx.lineTo(19 + 9 * s, -23); ctx.lineTo(19 + 12 * s, -20); ctx.lineTo(19 + 9 * s, -17); ctx.fill();
  }
  ctx.restore();
}

function drawStick(e) {
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -60 || x > VW + 60) return;
  const t = e.anim;
  const stunned = e.stun > 0 && !e.dead;
  const run = e.panic && !stunned && !e.dead;
  ctx.save();
  ctx.translate(x, y);
  if (e.dead && e.shot) { ctx.translate(e.w / 2, e.h / 2); ctx.scale(1, -1); ctx.translate(-e.w / 2, -e.h / 2); }
  const squash = (e.dead && !e.shot) ? 0.25 : 1;
  ctx.translate(0, e.h); ctx.scale(1, squash); ctx.translate(0, -e.h);
  if (stunned) ctx.translate(Math.sin(G.time * 2.2) * 1.5, 0);          // chvění

  const ink = '#3b3b3b';
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const lean = run ? e.dir * 3 : 0;

  // čárky rychlosti
  if (run) {
    ctx.save(); ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const yy of [20, 28, 35]) { ctx.moveTo(11 - e.dir * 16, yy); ctx.lineTo(11 - e.dir * (26 + (yy % 3) * 4), yy); }
    ctx.stroke(); ctx.restore();
  }

  // nohy (při běhu kmitají, s dvěma "duchy" pro rozmazání)
  const legs = (phase, amp, alpha) => {
    const sw = Math.sin(phase) * amp;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(11 + lean, 27); ctx.lineTo(4 + sw, 38 - Math.max(0, Math.cos(phase)) * 3);
    ctx.moveTo(11 + lean, 27); ctx.lineTo(18 - sw, 38 - Math.max(0, -Math.cos(phase)) * 3);
    ctx.stroke(); ctx.globalAlpha = 1;
  };
  if (run) { legs(t - 1.4, 9, 0.25); legs(t - 0.7, 9, 0.45); legs(t, 9, 1); }
  else if (stunned) legs(t, 3, 1);
  else legs(t * 2, 4, 1);

  // tělo
  ctx.beginPath(); ctx.moveTo(11, 19); ctx.lineTo(11 + lean, 27); ctx.stroke();

  // ruce
  ctx.beginPath();
  if (run || stunned) {
    const w = run ? Math.sin(t * 3) * 4 : 0;
    ctx.moveTo(11, 22); ctx.lineTo(2, 12 + w); ctx.moveTo(11, 22); ctx.lineTo(20, 12 - w);
  } else {
    ctx.moveTo(11, 22); ctx.lineTo(3, 29); ctx.moveTo(11, 22); ctx.quadraticCurveTo(17, 23, 19, 30);
  }
  ctx.stroke();

  // tykadla
  const wob = Math.sin(G.time * (run ? 0.6 : 0.15) + e.x) * (run ? 3 : 1);
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(8, 2.5); ctx.lineTo(3 + wob, -13);
  ctx.moveTo(14, 2); ctx.lineTo(20 + wob, -15);
  ctx.moveTo(18, 5); ctx.lineTo(26 + wob, -9);
  ctx.stroke();

  // hlava s červenou čmáranicí
  ctx.fillStyle = '#f3efe6'; ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(232,80,70,.85)'; ctx.lineWidth = 1.7;
  ctx.beginPath();
  for (let i = 0; i < 9; i++) { const yy = 2 + i * 2.1; ctx.moveTo(1, yy + (i % 2) * 1.6); ctx.lineTo(21, yy + ((i + 1) % 2) * 1.6); }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(11, 10, 9, 0, 7); ctx.stroke();

  // oči: levé velké s kroužkem, pravé menší vybarvené
  const eo = e.dir * 0.8;
  if (stunned || e.dead) {
    ctx.lineWidth = 1.5; ctx.beginPath();
    for (const ex of [8, 15.5]) { ctx.moveTo(ex - 2, 7); ctx.lineTo(ex + 2, 12); ctx.moveTo(ex + 2, 7); ctx.lineTo(ex - 2, 12); }
    ctx.stroke();
  } else {
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(8 + eo, 9, 3, 4, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(8 + eo, 9, 1.2, 2.6, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.beginPath(); ctx.ellipse(15.5 + eo, 10, 1.7, 3, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  // pusa
  if (run || stunned) { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(11, 15.5, 2.6, 3, 0, 0, 7); ctx.fill(); }
  else { ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(5, 15.5); ctx.lineTo(11, 16.2); ctx.lineTo(17, 15.8); ctx.stroke(); }
  ctx.restore();
}

function drawBoss(e) {
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -120 || x > VW + 120) return;
  const rage = e.hp <= BOSS.hp / 2;
  ctx.save();
  ctx.translate(x + e.w / 2, y + e.h / 2);
  if (e.dying) { ctx.rotate(e.spin); const sc = Math.max(0.15, e.timer / 100); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, e.timer / 40); }
  else if (e.hurt > 0 && Math.floor(e.hurt / 4) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.scale(e.dir, 1);
  ctx.translate(-e.w / 2, -e.h / 2);
  if (rage && !e.dying) { ctx.shadowColor = '#ff3030'; ctx.shadowBlur = 16; }
  const sw = Math.sin(e.anim * 2) * 4;

  // boty a nohy
  ctx.fillStyle = '#2f5aa8'; ctx.fillRect(14, 78, 14, 14); ctx.fillRect(36, 78, 14, 14);
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.ellipse(21 + sw, 93, 13, 5, 0, 0, 7); ctx.ellipse(43 - sw, 93, 13, 5, 0, 0, 7); ctx.fill();

  // ruce (za tělem)
  ctx.strokeStyle = '#f7d02c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, 52); ctx.lineTo(-6, 66 + sw); ctx.moveTo(58, 52); ctx.lineTo(70, 66 - sw); ctx.stroke();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-6, 67 + sw, 6, 0, 7); ctx.arc(70, 67 - sw, 6, 0, 7); ctx.fill();

  // tělo (žlutá kapsle) + montérky
  ctx.shadowBlur = 0;
  const body = () => { ctx.beginPath(); ctx.moveTo(4, 30); ctx.arc(32, 30, 28, Math.PI, 0); ctx.lineTo(60, 70); ctx.quadraticCurveTo(60, 84, 46, 84); ctx.lineTo(18, 84); ctx.quadraticCurveTo(4, 84, 4, 70); ctx.closePath(); };
  ctx.fillStyle = '#f7d02c'; body(); ctx.fill();
  ctx.save(); body(); ctx.clip();
  ctx.fillStyle = '#2f5aa8'; ctx.fillRect(0, 56, 64, 32);
  ctx.fillRect(12, 36, 8, 22); ctx.fillRect(44, 36, 8, 22);
  ctx.fillStyle = '#244a8c'; ctx.fillRect(22, 64, 20, 13);
  ctx.fillStyle = '#f7d02c'; ctx.beginPath(); ctx.arc(16, 56, 2.6, 0, 7); ctx.arc(48, 56, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 22, 64, 7);                                    // pásek brýlí
  ctx.restore();

  // brýle a oči
  for (const gx of [20, 44]) {
    ctx.fillStyle = '#c9ced6'; ctx.beginPath(); ctx.arc(gx, 26, 11.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#666'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx, 26, 8.5, 0, 7); ctx.fill();
    ctx.fillStyle = rage ? '#7a1010' : '#5a3a1a'; ctx.beginPath(); ctx.arc(gx + 2, 26, rage ? 3.2 : 4.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(gx + 2.4, 26, 2, 0, 7); ctx.fill();
  }
  if (rage) {                                                                                // zamračené obočí
    ctx.strokeStyle = '#2a1a00'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, 12); ctx.lineTo(28, 19); ctx.moveTo(56, 12); ctx.lineTo(36, 19); ctx.stroke();
  }
  // vlasy
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = -2; i <= 2; i++) { ctx.moveTo(32 + i * 4, 3); ctx.quadraticCurveTo(32 + i * 7, -8, 32 + i * 9, -6 + Math.abs(i) * 2); }
  ctx.stroke();
  // pusa
  if (rage || e.hurt > 0) {
    ctx.fillStyle = '#3a0a0a'; ctx.beginPath(); ctx.ellipse(32, 47, 11, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(24, 40, 16, 4);
  } else {
    ctx.strokeStyle = '#3a2a00'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(32, 42, 10, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.type === 'boss') return drawBoss(e);
  if (e.type === 'stick') return drawStick(e);
  const x = Math.round(e.x - G.cam), y = Math.round(e.y);
  if (x < -40 || x > VW + 40) return;
  ctx.save();
  ctx.translate(x + e.w / 2, y + e.h / 2);               // střed Pac-Mana
  if (e.dead && e.shot) ctx.scale(1, -1);                 // trefen ohněm: převrátí se
  ctx.scale(e.dir, 1);                                    // kouká ve směru chůze

  const R = 13;
  let mouth;
  if (e.dead && !e.shot) mouth = (1 - e.timer / 30) * Math.PI * 0.98;   // klasické "zmizení" po zašlápnutí
  else mouth = (0.04 + Math.abs(Math.sin(e.anim * 2.5)) * 0.32) * Math.PI; // žvýkání

  ctx.fillStyle = '#ffd400';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, R, mouth, Math.PI * 2 - mouth);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c99700'; ctx.lineWidth = 1.5; ctx.stroke();

  if (!(e.dead && !e.shot)) {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(2, -7, 2.3, 0, 7); ctx.fill();    // oko
    ctx.fillStyle = '#fff'; ctx.fillRect(2.4, -8.2, 1, 1);
  }
  ctx.restore();
}

function drawFireballs() {
  for (const f of fireballs) {
    const x = f.x - G.cam + 5, y = f.y + 5;
    const r = 6 + Math.sin(G.time * 0.8) * 1;
    ctx.fillStyle = 'rgba(255,90,30,.35)'; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
  }
}

function drawParticles() {
  for (const q of particles) {
    const a = Math.min(1, q.life / 15);
    ctx.globalAlpha = a;
    if (q.text) {
      ctx.fillStyle = q.color; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3;
      ctx.strokeText(q.text, q.x - G.cam, q.y); ctx.fillText(q.text, q.x - G.cam, q.y);
    } else {
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x - G.cam, q.y, q.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  HUD a obrazovky
// ============================================================
function text(str, x, y, size, color = '#fff', align = 'left', stroke = true) {
  ctx.font = `bold ${size}px system-ui, sans-serif`; ctx.textAlign = align;
  if (stroke) { ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD() {
  text('♥', 16, 34, 28, '#ff4d6d'); text('× ' + G.lives, 48, 33, 22);
  text('LEVEL ' + G.level + '/' + LEVEL_COUNT + ' · ' + LV.name, VW / 2, 24, 15, 'rgba(255,255,255,.92)', 'center');
  const boss = LV.boss && enemies.find(e => e.type === 'boss');
  if (boss) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(VW / 2 - 152, 36, 304, 20);
    ctx.fillStyle = boss.hp <= BOSS.hp / 2 ? '#ff4a3a' : '#f7d02c'; ctx.fillRect(VW / 2 - 150, 38, 300 * Math.max(0, boss.hp) / BOSS.hp, 16);
    text('MIMOŇ', VW / 2, 52, 13, '#fff', 'center');
  }
  ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(26, 58, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#c99700'; ctx.fillRect(24, 52, 3, 12);
  text('× ' + G.coins, 42, 65, 18);
  const powers = [['fire', 'OHEŇ', '#ff7a1a', 3600], ['wings', 'LÉTÁNÍ', '#3cb44b', 600], ['wheels', 'TRAKTOR', '#d94040', 1800]];
  let by = 82;
  for (const [k, label, col, max] of powers) {
    const v = P[k];
    if (v <= 0) continue;
    ctx.globalAlpha = (v < 300 && Math.floor(v / 8) % 2 === 0) ? 0.35 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(16, by, 130, 18);
    ctx.fillStyle = col; ctx.fillRect(16, by, 130 * v / max, 18);
    text(label + ' ' + Math.ceil(v / 60) + ' s', 22, by + 14, 13);
    ctx.globalAlpha = 1; by += 24;
  }
  text('SKÓRE ' + String(G.score).padStart(6, '0'), VW - 16, 32, 22, '#fff', 'right');
  if (G.muted) text('🔇', VW - 16, 58, 16, '#fff', 'right');
}

function overlay(alpha = 0.55) { ctx.fillStyle = `rgba(10,8,25,${alpha})`; ctx.fillRect(0, 0, VW, VH); }

function drawTitle() {
  drawBackground();
  // ozdobná zem
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 400, VW, 14);
  ctx.fillStyle = '#8a5a34'; ctx.fillRect(0, 414, VW, 70);
  overlay(0.25);
  text('DRÁČEK', VW / 2, 120, 76, '#ffd93b', 'center');
  text('plošinovka', VW / 2, 158, 26, '#fff', 'center');
  drawDragon(VW / 2, 400, 1, G.time * 0.1, false, 0, (G.time % 120) < 10 ? 10 - (G.time % 120) : 0, 3.2, (G.time % 150) > 140);
  if (Math.floor(G.time / 30) % 2 === 0) text('Stiskni ENTER nebo MEZERNÍK', VW / 2, 440, 24, '#fff', 'center');
  text('Projdi 21 levelů, sbírej mince i životy a poraž Mimoně na hradě!', VW / 2, 200, 17, '#fff', 'center');
  text('Bonusy v blocích ?: oheň · létání · traktorová kola · truhlička', VW / 2, 228, 16, '#ffe066', 'center');
  text('Pozor na Pankáče: po prvním zásahu utíká, zničíš ho až druhým!', VW / 2, 254, 15, '#ffb27a', 'center');
}

function drawEnd(win) {
  overlay(0.6);
  if (win) {
    text('VYHRÁL JSI! 🐉🔥', VW / 2, 170, 56, '#ffd93b', 'center');
    text('Mimoň je poražen a všech ' + LEVEL_COUNT + ' levelů zdolaných!', VW / 2, 218, 22, '#fff', 'center');
    text('Skóre: ' + G.score + '   (bonus za životy: ' + (G.lives * 500) + ')', VW / 2, 262, 24, '#fff', 'center');
  } else {
    text('KONEC HRY', VW / 2, 180, 60, '#ff6b6b', 'center');
    text('Došel jsi do levelu ' + G.level + ' · skóre: ' + G.score, VW / 2, 232, 24, '#fff', 'center');
    text('Hra se neukládá, začneš znovu od prvního levelu.', VW / 2, 266, 16, '#ffd9d9', 'center');
  }
  if (G.t2 > 45) text('ENTER – hrát znovu', VW / 2, 318, 22, '#fff', 'center');
}

function drawClear() {
  overlay(0.55);
  text('LEVEL ' + G.level + ' SPLNĚN!', VW / 2, 170, 54, '#ffd93b', 'center');
  text('Bonus +' + G.clearBonus + ' · skóre ' + G.score + ' · životy ' + G.lives, VW / 2, 218, 22, '#fff', 'center');
  const next = THEMES[G.level];
  const nm = G.level + 1 === LEVEL_COUNT ? 'BOSS – ' + next.name : next.name;
  text('Další: level ' + (G.level + 1) + ' – ' + nm, VW / 2, 262, 20, '#bfe6ff', 'center');
  if (G.t2 > 45) text('ENTER – pokračovat', VW / 2, 312, 22, '#fff', 'center');
}

function drawPlay() {
  drawBackground();
  drawItems();
  drawTiles();
  drawFlags();
  drawCoins();
  enemies.forEach(drawEnemy);
  drawFireballs();
  const p = P;
  const flicker = p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0;
  if (!flicker) drawDragon(p.x + p.w / 2 - G.cam, p.y + p.h, p.face, p.anim, !p.ground, p.vy, p.breath, 1, false,
    { flying: p.wings > 0, spin: p.spin, wheels: p.wheels > 0, wheelRot: p.wrot });
  drawParticles();
  drawHUD();
  if (G.banner > 0) {
    ctx.globalAlpha = Math.min(1, G.banner / 40);
    text('LEVEL ' + G.level, VW / 2, 190, 54, '#ffd93b', 'center');
    text(LV.name, VW / 2, 232, 28, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
  if (G.paused) { overlay(0.5); text('PAUZA', VW / 2, VH / 2, 56, '#fff', 'center'); text('P – pokračovat', VW / 2, VH / 2 + 40, 20, '#fff', 'center'); }
}

// ============================================================
//  Hlavní smyčka (pevný krok 60 Hz)
// ============================================================
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;

function tick() {
  if (G.stT !== G.state) { G.stT = G.state; G.t2 = 0; }
  if (G.state === 'title') {
    G.time++;
    if (pressedEnter) newGame();
  } else if (G.state === 'play') {
    if (!G.paused) updatePlay();
  } else {
    G.time++; G.t2++;                                      // krátká prodleva, ať Enter/skok hned nepřeskočí obrazovku
    if (pressedEnter && G.t2 > 45) {
      if (G.state === 'clear') startLevel(G.level + 1); else newGame();
    }
  }
  pressedEnter = false;
}

function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }

  ctx.clearRect(0, 0, VW, VH);
  if (G.state === 'title') drawTitle();
  else { drawPlay(); if (G.state === 'win') drawEnd(true); else if (G.state === 'over') drawEnd(false); else if (G.state === 'clear') drawClear(); }
  text('v' + VERSION, 10, VH - 10, 14, 'rgba(255,255,255,.85)');      // verze v levém dolním rohu
  requestAnimationFrame(frame);
}

G.level = 1; G.banner = 0; G.t2 = 0;
buildLevel(1);
P = newPlayer(2 * T);
requestAnimationFrame(frame);

// pro testování
window.__game = { G, get P() { return P; }, keys };
</script>
</body>
</html>
